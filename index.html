<body class="indexPage">

    <div id="app">


    <div id="feedTabs">
        <button class="feedTab active" data-feed="foryou">For You</button>
        <button class="feedTab" data-feed="following">Following</button>
    </div>

    <div id="feedContainer"></div>


    <div id="topBarContainer"></div>


    <div id="bottomNavContainer"></div>



    <!-- COMMENTS PANEL -->

    <div id="commentsPanel">


        <div class="commentsHeader">

            <h3>Comments</h3>

            <button id="closeCommentsBtn">
                <img src="assets/icons/solid/x-mark.svg" style="width:1em;height:1em;vertical-align:middle;" alt="close">
            </button>

        </div>



        <div id="commentsList"></div>



        <div class="commentInputArea">

            <input 
            id="commentInput"
            placeholder="Add comment...">


            <button id="sendCommentBtn">
                Send
            </button>

        </div>


    </div>


</div>
