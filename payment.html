<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Wallet - CloudTok</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/settings.css">
<style>
body{background:#000;}
.walletHeader{width:100%;max-width:600px;display:flex;align-items:center;justify-content:space-between;padding:16px;}
.walletHeader h2{color:#fff;font-size:20px;font-weight:700;}
.backBtn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.walletCard{width:100%;max-width:600px;margin:0 auto 20px;padding:24px;background:linear-gradient(135deg,#00b7ff,#7b2ff2);border-radius:20px;display:flex;flex-direction:column;gap:8px;}
.walletLabel{color:rgba(255,255,255,.7);font-size:13px;}
.walletBalance{color:#fff;font-size:36px;font-weight:800;}
.walletActions{display:flex;gap:10px;margin-top:12px;}
.walletActionBtn{flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
.walletActionBtn:hover{background:rgba(255,255,255,.2);}
.paymentsContent{width:100%;max-width:600px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:24px;}
.section{display:flex;flex-direction:column;gap:12px;}
.section h3{color:rgba(255,255,255,.5);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;}
.giftGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.giftItem{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;background:rgba(255,255,255,.04);border-radius:14px;cursor:pointer;}
.giftItem:hover{background:rgba(255,255,255,.08);}
.giftEmoji{font-size:32px;}
.giftName{color:#fff;font-size:12px;font-weight:500;}
.giftPrice{color:#00b7ff;font-size:13px;font-weight:700;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:9999;animation:toastIn .3s ease;}
.toast.success{background:#00c853;color:#fff;}
.toast.error{background:#ff2d55;color:#fff;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
</style>
<link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
<div class="walletHeader">
    <button class="backBtn" onclick="history.back()">←</button>
    <h2>Wallet</h2>
    <div style="width:40px;"></div>
</div>
<div class="walletCard">
    <span class="walletLabel">Balance</span>
    <span class="walletBalance" id="walletBalance">$0.00</span>
    <div class="walletActions">
        <button class="walletActionBtn" onclick="location.href='fund.html'">Add Funds</button>
        <button class="walletActionBtn" onclick="location.href='withdraw.html'">Withdraw</button>
    </div>
</div>
<div class="paymentsContent">
<div class="section">
    <h3>Virtual Gifts</h3>
    <p style="color:rgba(255,255,255,.4);font-size:13px;">Send gifts to your favorite creators during live streams</p>
    <div class="giftGrid">
        <div class="giftItem" onclick="buyGift('Rose',0.99)"><span class="giftEmoji">🌹</span><span class="giftName">Rose</span><span class="giftPrice">$0.99</span></div>
        <div class="giftItem" onclick="buyGift('Heart',1.99)"><span class="giftEmoji">❤️</span><span class="giftName">Heart</span><span class="giftPrice">$1.99</span></div>
        <div class="giftItem" onclick="buyGift('Star',4.99)"><span class="giftEmoji">⭐</span><span class="giftName">Star</span><span class="giftPrice">$4.99</span></div>
        <div class="giftItem" onclick="buyGift('Fire',9.99)"><span class="giftEmoji">🔥</span><span class="giftName">Fire</span><span class="giftPrice">$9.99</span></div>
        <div class="giftItem" onclick="buyGift('Diamond',19.99)"><span class="giftEmoji">💎</span><span class="giftName">Diamond</span><span class="giftPrice">$19.99</span></div>
        <div class="giftItem" onclick="buyGift('Crown',49.99)"><span class="giftEmoji">👑</span><span class="giftName">Crown</span><span class="giftPrice">$49.99</span></div>
    </div>
</div>
<div class="section">
    <h3>Recent Transactions</h3>
    <div id="transactionList"><p style="color:rgba(255,255,255,.3);font-size:13px;text-align:center;padding:20px;">Loading...</p></div>
</div>
</div>
<script src="assets/js/api/api.js"></script>
<script>
function showToast(msg,type="success"){const t=document.createElement("div");t.className="toast "+type;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}
async function loadBalance(){try{const r=await CloudTokAPI.request("/wallet/balance");document.getElementById("walletBalance").textContent="$"+(r.balance||0).toFixed(2);}catch(e){}}
async function loadTransactions(){try{const r=await CloudTokAPI.getTransactions();const l=document.getElementById("transactionList");if(!r.transactions||!r.transactions.length){l.innerHTML='<p style="color:rgba(255,255,255,.3);font-size:13px;text-align:center;padding:20px;">No transactions yet</p>';return;}l.innerHTML="";r.transactions.slice(0,10).forEach(t=>{const d=document.createElement("div");d.style.cssText="display:flex;align-items:center;gap:14px;padding:16px;background:rgba(255,255,255,.04);border-radius:14px;margin-bottom:8px;";d.innerHTML=`<div style="width:40px;height:40px;border-radius:10px;background:rgba(0,200,83,.15);display:flex;align-items:center;justify-content:center;font-size:18px;">💰</div><div style="flex:1;"><div style="color:#fff;font-size:15px;font-weight:600;">$${(t.amount||0).toFixed(2)}</div><div style="color:rgba(255,255,255,.4);font-size:12px;">${t.reference||""} • ${new Date(t.created_at).toLocaleDateString()}</div></div><div style="color:#00c853;font-size:13px;font-weight:600;">+$${(t.amount||0).toFixed(2)}</div>`;l.appendChild(d);});}catch(e){}}
function buyGift(n,p){showToast("Go to a live stream to send "+n+" ($"+p+") gifts!");}
loadBalance();loadTransactions();
</script>
<script src="assets/js/core/webrtc.js"></script>
<script src="assets/js/core/callPoller.js"></script>
</body>
</html>
