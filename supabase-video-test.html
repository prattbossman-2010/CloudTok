<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>CloudTok Supabase Video Test</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

    background:#111;

    color:#fff;

    padding:16px;

    line-height:1.45;

}

.container{

    max-width:640px;

    margin:0 auto;

}

h1{

    font-size:22px;

    margin-bottom:8px;

}

.description{

    color:#aaa;

    font-size:14px;

    margin-bottom:20px;

}

button{

    width:100%;

    padding:16px;

    border:none;

    border-radius:10px;

    background:#2196f3;

    color:white;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    margin-bottom:16px;

}

button:disabled{

    opacity:0.5;

}

#status{

    padding:14px;

    background:#1a1a1a;

    border-radius:10px;

    white-space:pre-wrap;

    word-break:break-word;

    font-size:13px;

    margin-bottom:20px;

}

.videoCard{

    background:#1c1c1c;

    border-radius:12px;

    padding:14px;

    margin-bottom:20px;

}

.videoCard video{

    display:block;

    width:100%;

    max-height:70vh;

    background:#000;

    border-radius:10px;

    margin-bottom:12px;

}

.videoName{

    font-weight:700;

    margin-bottom:8px;

    word-break:break-all;

}

.videoInfo{

    color:#aaa;

    font-size:13px;

    margin-bottom:4px;

}

.videoUrl{

    display:block;

    color:#4fc3f7;

    font-size:12px;

    word-break:break-all;

    margin-top:10px;

}

.success{

    color:#4caf50;

}

.error{

    color:#f44336;

}

.empty{

    background:#1c1c1c;

    padding:20px;

    border-radius:10px;

    color:#aaa;

    text-align:center;

}

</style>

</head>


<body>


<div class="container">


<h1>
CloudTok Supabase Video Test
</h1>


<p class="description">

This page loads all videos currently stored
inside the Supabase cloudtok-videos bucket.

</p>


<button id="loadButton">

Load Supabase Videos

</button>


<div id="status">

Waiting to load videos...

</div>


<div id="videoList"></div>


</div>


<script>


const API =
"https://cloudtok-api.bossmanp16.workers.dev/api";


const loadButton =
document.getElementById("loadButton");


const statusEl =
document.getElementById("status");


const videoList =
document.getElementById("videoList");



function setStatus(message){

    statusEl.textContent =
    message;

}



function formatSize(bytes){

    if(!bytes){

        return "Unknown size";

    }


    const mb =
    bytes / 1024 / 1024;


    return mb.toFixed(2) +
    " MB";

}



async function loadSupabaseVideos(){


    const token =
    localStorage.getItem(
        "CloudTokToken"
    );


    if(!token){

        setStatus(
            "❌ CloudTokToken not found.\n\n" +
            "Please log into CloudTok first."
        );

        return;

    }


    loadButton.disabled =
    true;


    videoList.innerHTML =
    "";


    setStatus(
        "Loading videos from Supabase...\n\n" +
        "Please wait."
    );


    try{


        const response =
        await fetch(

            API +
            "/storage/test/supabase-videos",

            {

                method:"GET",

                headers:{

                    Authorization:
                    "Bearer " + token

                }

            }

        );


        const text =
        await response.text();


        let data;


        try{

            data =
            JSON.parse(text);

        }
        catch(error){

            throw new Error(
                "Worker returned invalid JSON:\n\n" +
                text
            );

        }


        if(!response.ok){

            throw new Error(

                "HTTP " +
                response.status +
                "\n\n" +
                (
                    data.error ||
                    text
                )

            );

        }


        if(!data.success){

            throw new Error(

                data.error ||
                "Failed to load Supabase videos."

            );

        }


        const videos =
        data.videos || [];


        if(videos.length === 0){

            setStatus(

                "✅ Connected to Supabase.\n\n" +
                "No videos were found in the " +
                data.bucket +
                " bucket."

            );

            videoList.innerHTML =

                '<div class="empty">' +
                'No Supabase videos found.' +
                '</div>';

            return;

        }


        setStatus(

            "✅ SUPABASE STORAGE CONNECTED\n\n" +

            "Bucket: " +
            data.bucket +

            "\nVideos found: " +
            videos.length

        );


        videos.forEach(
            function(video, index){

                const card =
                document.createElement(
                    "div"
                );


                card.className =
                "videoCard";


                const player =
                document.createElement(
                    "video"
                );


                player.controls =
                true;


                player.playsInline =
                true;


                player.preload =
                "metadata";


                player.src =
                video.url;


                const name =
                document.createElement(
                    "div"
                );


                name.className =
                "videoName";


                name.textContent =
                "Video " +
                (index + 1) +
                ": " +
                video.name;


                const info =
                document.createElement(
                    "div"
                );


                info.className =
                "videoInfo";


                info.textContent =

                    "Size: " +
                    formatSize(video.size) +

                    " • Type: " +
                    (
                        video.contentType ||
                        "Unknown"
                    );


                const created =
                document.createElement(
                    "div"
                );


                created.className =
                "videoInfo";


                created.textContent =

                    "Created: " +
                    (
                        video.createdAt ||
                        "Unknown"
                    );


                const url =
                document.createElement(
                    "a"
                );


                url.className =
                "videoUrl";


                url.href =
                video.url;


                url.target =
                "_blank";


                url.rel =
                "noopener";


                url.textContent =
                video.url;


                player.addEventListener(
                    "loadedmetadata",
                    function(){

                        info.textContent =

                            "Size: " +
                            formatSize(video.size) +

                            " • Type: " +
                            (
                                video.contentType ||
                                "Unknown"
                            ) +

                            " • Resolution: " +

                            player.videoWidth +
                            " × " +
                            player.videoHeight +

                            " • Duration: " +

                            player.duration.toFixed(1) +
                            "s";

                    }
                );


                player.addEventListener(
                    "error",
                    function(){

                        const error =
                        document.createElement(
                            "div"
                        );


                        error.className =
                        "error";


                        error.textContent =
                        "❌ This video could not be played.";

                        card.appendChild(
                            error
                        );

                    }
                );


                card.appendChild(
                    player
                );


                card.appendChild(
                    name
                );


                card.appendChild(
                    info
                );


                card.appendChild(
                    created
                );


                card.appendChild(
                    url
                );


                videoList.appendChild(
                    card
                );

            }
        );


    }
    catch(error){

        setStatus(

            "❌ FAILED TO LOAD SUPABASE VIDEOS\n\n" +

            error.message

        );

    }
    finally{

        loadButton.disabled =
        false;

    }

}



loadButton.addEventListener(
    "click",
    loadSupabaseVideos
);


</script>


</body>

</html>
