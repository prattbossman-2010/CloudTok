<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Streams - CloudTok</title>
<meta name="description" content="Watch live streams on CloudTok. Join real-time conversations, send gifts, and interact with your favorite creators.">
<meta property="og:title" content="Live Streams - CloudTok">
<meta property="og:description" content="Watch live streams on CloudTok. Join real-time conversations and send gifts.">
<meta property="og:type" content="website">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://prattbossman-2010.github.io/CloudTok/liveStreams.html">
<link rel="stylesheet" href="assets/css/base.css">
<style>
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;margin:0;padding:0;}
.header{display:flex;align-items:center;gap:12px;padding:16px;position:sticky;top:0;background:#000;z-index:10;}
.back{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.header h1{font-size:20px;font-weight:700;flex:1;}
.liveDot{width:8px;height:8px;border-radius:50%;background:#ff2d55;display:inline-block;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.streams{padding:0 16px 80px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.streamCard{border-radius:16px;overflow:hidden;background:#111;cursor:pointer;position:relative;}
.streamCard:hover{opacity:.9;}
.streamThumb{width:100%;aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;font-size:48px;}
.streamInfo{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.9));}
.streamTitle{font-size:14px;font-weight:600;margin-bottom:4px;}
.streamHost{font-size:12px;color:rgba(255,255,255,.6);}
.streamLive{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px;padding:4px 10px;background:rgba(255,45,85,.9);border-radius:20px;font-size:11px;font-weight:700;}
.empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3);}
.empty .icon{font-size:60px;margin-bottom:16px;}
.empty p{font-size:14px;}
.viewer{display:none;position:fixed;inset:0;background:#000;z-index:999;flex-direction:column;}
.viewer.active{display:flex;}
.viewerVideo{width:100%;height:100vh;object-fit:contain;background:#000;}
.viewerOverlay{position:absolute;top:0;left:0;right:0;padding:12px 16px;display:flex;align-items:center;gap:10px;background:linear-gradient(rgba(0,0,0,.7),transparent);z-index:2;}
.viewerOverlay .back{width:36px;height:36px;}
.viewerTitle{flex:1;font-size:16px;font-weight:600;}
.viewerHost{font-size:13px;color:rgba(255,255,255,.6);}
.viewerLive{display:flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(255,45,85,.9);border-radius:20px;font-size:12px;font-weight:600;}
.viewerStatus{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);padding:8px 16px;background:rgba(0,0,0,.6);border-radius:20px;font-size:13px;z-index:2;}
.viewerBottom{position:absolute;bottom:0;left:0;right:0;padding:12px 16px;display:flex;align-items:center;gap:10px;background:linear-gradient(transparent,rgba(0,0,0,.8));z-index:2;}
.giftBtn{background:rgba(255,255,255,.15);border:none;color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer;flex-shrink:0;}
.giftBtn:hover{background:rgba(255,45,85,.3);}
.viewerInput{flex:1;padding:10px 14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);border-radius:20px;color:#fff;font-size:14px;outline:none;}
.viewerInput::placeholder{color:rgba(255,255,255,.4);}
.viewerSend{background:#ff2d55;border:none;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;}
.liveChatMessages{position:absolute;bottom:70px;left:12px;right:12px;max-height:180px;display:flex;flex-direction:column;gap:0;z-index:2;pointer-events:none;}
.floatingViewerMsg{position:fixed;padding:6px 14px;background:rgba(0,0,0,.55);border-radius:20px;font-size:13px;color:#fff;max-width:70%;pointer-events:none;animation:floatUp 5s ease-out forwards;white-space:nowrap;}
.floatingViewerMsg .chatUser{color:#ff2d55;font-weight:600;margin-right:6px;}
@keyframes floatUp{0%{opacity:1;bottom:120px;}80%{opacity:1;}100%{opacity:0;bottom:calc(100vh - 60px);}}
.giftPanel{display:none;position:absolute;bottom:70px;left:0;right:0;background:rgba(0,0,0,.9);border-top:1px solid rgba(255,255,255,.1);padding:12px;z-index:3;}
.giftPanel.show{display:block;}
.giftPanelTitle{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;}
.giftGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.giftItem{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;background:rgba(255,255,255,.06);border-radius:12px;cursor:pointer;border:2px solid transparent;transition:all .2s;}
.giftItem:hover{background:rgba(255,255,255,.1);border-color:rgba(255,45,85,.3);}
.giftItem.selected{border-color:#ff2d55;background:rgba(255,45,85,.15);}
.giftEmoji{font-size:28px;}
.giftName{font-size:10px;color:rgba(255,255,255,.7);}
.giftPrice{font-size:11px;color:#ff2d55;font-weight:700;}
.giftBalance{font-size:12px;color:rgba(255,255,255,.5);margin-top:8px;text-align:center;}
.giftSendBtn{width:100%;margin-top:8px;padding:10px;background:#ff2d55;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;}
.giftSendBtn:disabled{opacity:.4;cursor:not-allowed;}
.giftAnimation{position:fixed;bottom:200px;left:50%;transform:translateX(-50%);font-size:60px;z-index:9999;pointer-events:none;animation:giftFloat 2s ease-out forwards;}
@keyframes giftFloat{0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}100%{opacity:0;transform:translateX(-50%) translateY(-200px) scale(1.5);}}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:9999;}
.toast.success{background:#00c853;color:#fff;}
.toast.error{background:#ff2d55;color:#fff;}
</style>
</head>
<body>
<div class="header">
    <button class="back" onclick="history.back()">←</button>
    <h1>🔴 Live Streams</h1>
</div>
<div class="streams" id="streamsGrid"></div>

<div class="viewer" id="viewer">
    <video class="viewerVideo" id="viewerVideo" autoplay playsinline></video>
    <div class="viewerOverlay">
        <button class="back" onclick="closeViewer()">←</button>
        <div>
            <div class="viewerTitle" id="viewerTitle"></div>
            <div class="viewerHost" id="viewerHost"></div>
        </div>
        <div class="viewerLive"><span class="liveDot"></span> LIVE</div>
    </div>
    <div class="viewerStatus" id="viewerStatus">Connecting...</div>

    <div class="giftPanel" id="giftPanel">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <div class="giftPanelTitle">Send a Gift</div>
            <button onclick="document.getElementById('giftPanel').classList.remove('show')" style="background:none;border:none;color:rgba(255,255,255,.4);font-size:18px;cursor:pointer;padding:4px 8px;">✕</button>
        </div>
        <div class="giftBalance" id="giftBalance">Balance: $0.00</div>
        <div class="giftGrid" id="giftGrid"></div>
        <button class="giftSendBtn" id="giftSendBtn" disabled>Select a gift</button>
    </div>

    <div class="viewerBottom">
        <button class="giftBtn" id="giftToggleBtn">🎁</button>
        <input class="viewerInput" id="chatInput" placeholder="Send a message...">
        <button class="viewerSend" id="chatSendBtn">Send</button>
    </div>
</div>

<script src="assets/js/database/database.js"></script>
<script src="assets/js/api/api.js"></script>
<script src="assets/js/core/webrtc.js"></script>
<script>
let currentStream = null;
let viewerPC = null;
let signalPollInterval = null;
let lastSignalId = 0;
let viewerIceQueue = [];
let selectedGift = null;
let walletBalance = 0;
let lastChatId = 0;

const GIFTS = [
    { name: "Rose", emoji: "🌹", price: 0.99 },
    { name: "Heart", emoji: "❤️", price: 1.99 },
    { name: "Star", emoji: "⭐", price: 4.99 },
    { name: "Fire", emoji: "🔥", price: 9.99 },
    { name: "Diamond", emoji: "💎", price: 19.99 },
    { name: "Crown", emoji: "👑", price: 49.99 },
    { name: "Party", emoji: "🎉", price: 9.99 },
    { name: "Clap", emoji: "👏", price: 0.99 }
];

const ICE_SERVERS = [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    { urls: "stun:stun2.l.google.com:19302" },
    { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
    { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" }
];

function showToast(msg, type="success"){
    const t=document.createElement("div");
    t.className="toast "+type;
    t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),3000);
}

function showGiftAnimation(emoji){
    const el = document.createElement("div");
    el.className = "giftAnimation";
    el.textContent = emoji;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 2000);
}

function renderGiftGrid(){
    const grid = document.getElementById("giftGrid");
    grid.innerHTML = "";
    GIFTS.forEach(function(gift){
        const item = document.createElement("div");
        item.className = "giftItem";
        item.innerHTML = '<div class="giftEmoji">'+gift.emoji+'</div><div class="giftName">'+gift.name+'</div><div class="giftPrice">$'+gift.price.toFixed(2)+'</div>';
        item.onclick = function(){
            document.querySelectorAll(".giftItem").forEach(function(g){ g.classList.remove("selected"); });
            item.classList.add("selected");
            selectedGift = gift;
            document.getElementById("giftSendBtn").disabled = false;
            document.getElementById("giftSendBtn").textContent = "Send " + gift.emoji + " " + gift.name + " ($" + gift.price.toFixed(2) + ")";
        };
        grid.appendChild(item);
    });
}

async function loadWalletBalance(){
    if(!localStorage.getItem("CloudTokToken")) return;
    try {
        const result = await CloudTokAPI.request("/wallet/balance");
        walletBalance = result.balance || 0;
        document.getElementById("giftBalance").textContent = "Balance: $" + walletBalance.toFixed(2);
    } catch(e){}
}

async function sendGift(){
    if(!selectedGift || !currentStream) return;
    if(walletBalance < selectedGift.price){
        showToast("Insufficient balance. Fund your wallet first.","error");
        return;
    }

    try {
        const result = await CloudTokAPI.request("/gifts/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                receiver_username: currentStream.username,
                gift_name: selectedGift.name,
                gift_emoji: selectedGift.emoji,
                amount_usd: selectedGift.price,
                stream_id: currentStream.id
            })
        });

        if(result.success){
            showToast("Sent " + selectedGift.emoji + " " + selectedGift.name + "!");
            showGiftAnimation(selectedGift.emoji);
            walletBalance = result.wallet_balance;
            document.getElementById("giftBalance").textContent = "Balance: $" + walletBalance.toFixed(2);
            selectedGift = null;
            document.querySelectorAll(".giftItem").forEach(function(g){ g.classList.remove("selected"); });
            document.getElementById("giftSendBtn").disabled = true;
            document.getElementById("giftSendBtn").textContent = "Select a gift";
        } else {
            showToast(result.error || "Failed to send gift","error");
        }
    } catch(e){
        showToast("Failed to send gift","error");
    }
}

document.getElementById("giftToggleBtn").onclick = function(){
    const panel = document.getElementById("giftPanel");
    panel.classList.toggle("show");
    if(panel.classList.contains("show")){
        loadWalletBalance();
        renderGiftGrid();
    }
};

document.getElementById("giftSendBtn").onclick = sendGift;

function addLiveChatMessage(username, text){
    var el = document.createElement("div");
    el.className = "floatingViewerMsg";
    el.innerHTML = '<span class="chatUser">@'+username+'</span>'+text;
    el.style.left = (12 + Math.random() * 40) + 'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 5000);
}

document.getElementById("chatSendBtn").addEventListener("click", sendLiveChat);
document.getElementById("chatInput").addEventListener("keypress", function(e){
    if(e.key === "Enter") sendLiveChat();
});

async function sendLiveChat(){
    var input = document.getElementById("chatInput");
    var text = input.value.trim();
    if(!text || !currentStream) return;
    input.value = "";

    var currentUser = localStorage.getItem("CloudTokCurrentUser") || "viewer";
    addLiveChatMessage(currentUser, text);

    try {
        await CloudTokAPI.request("/live/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                stream_key: currentStream.stream_key,
                text: text,
                to_username: currentStream.username
            })
        });
    } catch(e){ console.error("[Viewer] Chat send failed:", e); }
}

async function pollLiveChat(){
    if(!currentStream) return;
    try {
        var result = await CloudTokAPI.request("/live/chat?stream_key=" + encodeURIComponent(currentStream.stream_key) + "&after=" + lastChatId);
        if(result && result.messages){
            result.messages.forEach(function(msg){
                if(msg.id > lastChatId) lastChatId = msg.id;
                if(msg.sender_username !== localStorage.getItem("CloudTokCurrentUser")){
                    addLiveChatMessage(msg.sender_username || "viewer", msg.text || "");
                }
            });
        }
    } catch(e){}
}

async function loadStreams(){
    const grid = document.getElementById("streamsGrid");
    try {
        const result = await CloudTokAPI.request("/live/streams");
        const streams = result.streams || [];
        if(streams.length === 0){
            grid.innerHTML = '<div class="empty"><div class="icon">📡</div><p>No live streams right now</p></div>';
            return;
        }
        grid.innerHTML = "";
        const colors = ["#ff2d55","#7b2ff2","#00b7ff","#00c853","#ff9500","#ff3b30"];
        streams.forEach((s, i) => {
            const card = document.createElement("div");
            card.className = "streamCard";
            const c1 = colors[i % colors.length];
            const c2 = colors[(i+3) % colors.length];
            card.innerHTML = `
                <div class="streamThumb" style="background:linear-gradient(135deg,${c1},${c2});">🎥</div>
                <div class="streamLive"><span class="liveDot"></span> LIVE</div>
                <div class="streamInfo">
                    <div class="streamTitle">${s.title || "Live Stream"}</div>
                    <div class="streamHost">@${s.username}</div>
                </div>
            `;
            card.onclick = () => joinStream(s);
            grid.appendChild(card);
        });
    } catch(e){
        grid.innerHTML = '<div class="empty"><div class="icon">📡</div><p>Unable to load streams</p></div>';
    }
}

async function joinStream(stream){
    if(!localStorage.getItem("CloudTokToken")){
        showToast("Please login first","error");
        return;
    }

    currentStream = stream;
    viewerIceQueue = [];
    document.getElementById("viewerTitle").textContent = stream.title || "Live Stream";
    document.getElementById("viewerHost").textContent = "@" + stream.username;
    document.getElementById("viewer").classList.add("active");
    document.getElementById("viewerStatus").textContent = "Connecting...";
    document.getElementById("giftPanel").classList.remove("show");
    selectedGift = null;

    viewerPC = new RTCPeerConnection({ iceServers: ICE_SERVERS });

    viewerPC.ontrack = (e) => {
        console.log("[Viewer] ontrack:", e.track.kind, "streams:", e.streams.length);
        if(e.streams && e.streams[0]){
            var videoEl = document.getElementById("viewerVideo");
            videoEl.srcObject = e.streams[0];
            videoEl.play().catch(function(){});
            document.getElementById("viewerStatus").textContent = "Watching live";
        }
    };

    viewerPC.onicecandidate = async (e) => {
        if(e.candidate){
            try {
                await CloudTokAPI.request("/webrtc/signal", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        to_username: stream.username,
                        signal_type: "live-ice-viewer",
                        signal_data: { candidate: e.candidate.toJSON(), stream_key: stream.stream_key }
                    })
                });
            } catch(err) { console.error("[Viewer] Failed to send ICE:", err); }
        }
    };

    viewerPC.onconnectionstatechange = () => {
        const state = viewerPC ? viewerPC.connectionState : "closed";
        if(state === "connected"){
            document.getElementById("viewerStatus").textContent = "Watching live";
        } else if(state === "failed"){
            document.getElementById("viewerStatus").textContent = "Connection failed";
        }
    };

    viewerPC.oniceconnectionstatechange = () => {
        console.log("[Viewer] ICE:", viewerPC ? viewerPC.iceConnectionState : "closed");
    };

    try {
        viewerPC.addTransceiver("video", { direction: "recvonly" });
        viewerPC.addTransceiver("audio", { direction: "recvonly" });
        const offer = await viewerPC.createOffer();
        await viewerPC.setLocalDescription(offer);

        await CloudTokAPI.request("/webrtc/signal", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                to_username: stream.username,
                signal_type: "live-join",
                signal_data: {
                    offer: { sdp: viewerPC.localDescription.sdp, type: viewerPC.localDescription.type },
                    stream_key: stream.stream_key
                }
            })
        });

        startSignalPoll();
    } catch(e){
        console.error("[Viewer] Failed to join:", e);
        document.getElementById("viewerStatus").textContent = "Failed to connect";
        showToast("Could not connect to stream", "error");
    }
}

function startSignalPoll(){
    if(signalPollInterval){ clearTimeout(signalPollInterval); }
    lastSignalId = 0;

    async function poll(){
        if(!currentStream) return;
        try {
            const result = await CloudTokAPI.request("/webrtc/poll?after=" + lastSignalId);
            if(result && result.signals){
                for(const signal of result.signals){
                    if(signal.id > lastSignalId) lastSignalId = signal.id;

                    if(signal.type === "live-answer" && viewerPC){
                        try {
                            await viewerPC.setRemoteDescription(new RTCSessionDescription(signal.data));
                            document.getElementById("viewerStatus").textContent = "Connected";
                            for(const c of viewerIceQueue){
                                try { await viewerPC.addIceCandidate(new RTCIceCandidate(c)); } catch(e) {}
                            }
                            viewerIceQueue = [];
                        } catch(e){ console.error("[Viewer] setRemoteDescription failed:", e); }
                    }
                    else if(signal.type === "live-ice" && viewerPC && signal.data && signal.data.candidate){
                        try {
                            if(viewerPC.remoteDescription){
                                await viewerPC.addIceCandidate(new RTCIceCandidate(signal.data.candidate));
                            } else {
                                viewerIceQueue.push(signal.data.candidate);
                            }
                        } catch(e){ console.error("[Viewer] ICE error:", e); }
                    }
                    else if(signal.type === "live-end"){
                        document.getElementById("viewerStatus").textContent = "Stream ended";
                        setTimeout(closeViewer, 1500);
                    }
                    else if(signal.type === "live-gift"){
                        showGiftAnimation(signal.data?.emoji || "🎁");
                    }
                    else if(signal.type === "live-chat-streamer" && signal.data){
                        addLiveChatMessage(signal.data.username || "streamer", signal.data.text || "");
                    }
                }
            }

            await pollLiveChat();
        } catch(e){}

        if(currentStream){
            signalPollInterval = setTimeout(poll, 800);
        }
    }
    poll();
}

function closeViewer(){
    if(viewerPC){
        try { viewerPC.close(); } catch(e){}
        viewerPC = null;
    }
    if(signalPollInterval){
        clearTimeout(signalPollInterval);
        signalPollInterval = null;
    }

    if(currentStream){
        try {
            CloudTokAPI.request("/webrtc/signal", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    to_username: currentStream.username,
                    signal_type: "live-leave",
                    signal_data: { stream_key: currentStream.stream_key }
                })
            });
        } catch(e){}
    }

    currentStream = null;
    viewerIceQueue = [];
    document.getElementById("viewer").classList.remove("active");
    document.getElementById("viewerVideo").srcObject = null;
    document.getElementById("giftPanel").classList.remove("show");
}

loadStreams();
setInterval(loadStreams, 10000);
</script>
</body>
</html>
