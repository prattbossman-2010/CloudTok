<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live - CloudTok</title>
<meta name="description" content="Start a live stream on CloudTok and connect with your audience in real-time.">
<link rel="stylesheet" href="assets/css/base.css">
<style>
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
.live-container{max-width:420px;width:100%;padding:20px;text-align:center}
.live-icon{font-size:80px;margin-bottom:20px}
h1{font-size:24px;margin:0 0 8px}
p{color:#aaa;margin:0 0 30px;font-size:14px}
.live-btn{background:#ff2d55;color:#fff;border:none;border-radius:50%;width:120px;height:120px;font-size:18px;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 0 30px rgba(255,45,85,.4)}
.live-btn:hover{transform:scale(1.08);box-shadow:0 0 50px rgba(255,45,85,.6)}
.live-btn:active{transform:scale(.95)}
.back{position:fixed;top:20px;left:20px;background:rgba(255,255,255,.1);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;z-index:10}
.info{margin-top:30px;padding:15px;background:rgba(255,255,255,.05);border-radius:12px;text-align:left}
.info h3{margin:0 0 10px;font-size:14px;color:#ff2d55}
.info ul{margin:0;padding:0 0 0 16px;color:#999;font-size:13px;line-height:1.8}
</style>
</head>
<body>
<button class="back" onclick="history.back()">&#8592;</button>
<div class="live-container">
<div class="live-icon">&#128248;</div>
<h1>Go Live</h1>
<p>Start a live stream and connect with your audience in real-time</p>
<button class="live-btn" id="goLiveBtn">GO LIVE</button>
<div class="info">
<h3>How it works</h3>
<ul>
<li>Click GO LIVE to start broadcasting</li>
<li>Your stream will be visible to all followers</li>
<li>Interact with viewers through live chat</li>
<li>End stream anytime by pressing stop</li>
</ul>
</div>
</div>
<script>
document.getElementById("goLiveBtn").onclick=()=>{
if(!localStorage.getItem("CloudTokToken")){
alert("Please login first");
window.location.href="index.html";
return;
}
alert("Live streaming will be available soon!");
};
</script>
</body>
</html>
