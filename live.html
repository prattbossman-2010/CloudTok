<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live - CloudTok</title>
<link rel="stylesheet" href="assets/css/base.css">
<style>
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
.live-container{max-width:420px;width:100%;padding:20px;text-align:center}
.live-icon{width:80px;height:80px;margin:0 auto 20px;background:rgba(255,45,85,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.live-icon svg{width:40px;height:40px;fill:#ff2d55;}
h1{font-size:24px;margin:0 0 8px}
p{color:#aaa;margin:0 0 30px;font-size:14px}

/* Mode Selector */
.modeSelector{display:flex;gap:8px;margin-bottom:16px;background:rgba(255,255,255,.04);border-radius:12px;padding:4px;}
.modeOption{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 8px;border-radius:10px;border:none;background:none;color:#888;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.modeOption.active{background:rgba(255,45,85,.15);color:#ff2d55;}
.modeOption svg{width:18px;height:18px;fill:currentColor;}
.modeOption:hover:not(.active){color:#ccc;}

.live-btn{background:#ff2d55;color:#fff;border:none;border-radius:50%;width:120px;height:120px;font-size:18px;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 0 30px rgba(255,45,85,.4)}
.live-btn:hover{transform:scale(1.08);box-shadow:0 0 50px rgba(255,45,85,.6)}
.live-btn:active{transform:scale(.95)}
.back{position:fixed;top:20px;left:20px;background:rgba(255,255,255,.1);border:none;color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;}
.back svg{width:20px;height:20px;fill:#fff;}

.streamView{display:none;width:100%;height:100vh;flex-direction:column;position:relative;}
.streamView.active{display:flex;}
.streamVideo{width:100%;height:100%;object-fit:cover;background:#000;}
.streamLocal{width:100px;height:130px;border-radius:12px;border:2px solid #ff2d55;object-fit:cover;position:fixed;top:80px;right:12px;z-index:5;}
.streamOverlay{position:absolute;top:0;left:0;right:0;padding:12px 16px;display:flex;align-items:center;gap:10px;background:linear-gradient(rgba(0,0,0,.7),transparent);z-index:6;}
.streamOverlay .back{position:static;width:36px;height:36px;}
.streamTitleDisplay{font-size:16px;font-weight:700;flex:1;}
.streamViewers{display:flex;align-items:center;gap:6px;padding:4px 10px;background:rgba(255,45,85,.9);border-radius:20px;font-size:12px;font-weight:600;}
.liveDot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.streamControls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:6;}
.streamCtrlBtn{width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;transition:background .2s;}
.streamCtrlBtn svg{width:22px;height:22px;fill:#fff;}
.streamCtrlBtn.end{background:rgba(255,45,85,.9);}
.streamCtrlBtn.mute{background:rgba(255,255,255,.2);}
.streamCtrlBtn.video{background:rgba(255,255,255,.2);}
.streamCtrlBtn.screenShare{background:rgba(255,255,255,.2);}
.streamCtrlBtn.cameraFlip{background:rgba(255,255,255,.2);}
.streamCtrlBtn.active{background:rgba(255,45,85,.4);}
.streamCtrlBtn.muted svg{fill:#ff4444;}

.activeStreams{width:100%;max-width:600px;margin-top:30px;}
.activeStreams h3{color:rgba(255,255,255,.5);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}
.streamCard{display:flex;align-items:center;gap:12px;padding:12px;background:rgba(255,255,255,.04);border-radius:12px;margin-bottom:8px;cursor:pointer;}
.streamCard:hover{background:rgba(255,255,255,.06);}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:9999;}
.toast.success{background:#00c853;color:#fff;}
.toast.error{background:#ff2d55;color:#fff;}
    /* Screen share preview */
    .screenShareHint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.6);padding:16px 24px;border-radius:12px;font-size:13px;color:#aaa;text-align:center;pointer-events:none;z-index:4;}
    .floatingMsg{position:fixed;bottom:120px;padding:6px 14px;background:rgba(0,0,0,.55);border-radius:20px;font-size:13px;color:#fff;max-width:70%;pointer-events:none;animation:floatUp 5s ease-out forwards;white-space:nowrap;}
    .floatingMsg .chatUser{color:#00b7ff;font-weight:600;margin-right:6px;}
    @keyframes floatUp{0%{opacity:1;bottom:120px;}80%{opacity:1;}100%{opacity:0;bottom:calc(100vh - 60px);}}

    /* Stream Input Bar */
    .streamInputBar{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);border-radius:16px 16px 0 0;padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;z-index:10;}
    .streamInputBar .emojiToggleBtn,.streamInputBar .gifToggleBtn,.streamInputBar .stickerToggleBtn{background:none;border:none;color:rgba(255,255,255,.5);font-size:18px;cursor:pointer;padding:6px;border-radius:50%;}
    .streamInputBar .emojiToggleBtn:hover,.streamInputBar .gifToggleBtn:hover,.streamInputBar .stickerToggleBtn:hover{color:#fff;background:rgba(255,255,255,.1);}
    .streamInputBar input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:14px;padding:8px 12px;min-width:0;}
    .streamInputBar input::placeholder{color:rgba(255,255,255,.4);}
    .streamInputBar #liveSendBtn{background:#fe2c55;border:none;color:#fff;padding:8px 16px;border-radius:16px;font-weight:700;cursor:pointer;font-size:13px;}
    .streamInputBar #liveSendBtn:hover{background:#e0244a;}

    .emojiBar,.gifPanel,.stickerPanel{display:none;position:absolute;bottom:100%;left:0;right:0;background:rgba(0,0,0,.9);border-bottom:1px solid rgba(255,255,255,.08);max-height:300px;overflow-y:auto;padding:10px;z-index:90;border-radius:12px 12px 0 0;}
    .emojiBar.show,.gifPanel.show,.stickerPanel.show{display:block;}
    .emojiRow{display:flex;gap:4px;flex-wrap:wrap;}
    .emojiRow button{background:none;border:none;font-size:24px;cursor:pointer;padding:6px;border-radius:8px;transition:background .2s;flex-shrink:0;}
    .emojiRow button:hover{background:rgba(255,255,255,.08);}
    .gifGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
    .stickerGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}

    .liveGifItem{border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:1;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;}
    .liveGifItem:hover{transform:scale(1.05);}
    .liveGifItem img{width:100%;height:100%;object-fit:cover;border-radius:10px;}
    .liveStickerItem{border-radius:10px;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;aspect-ratio:1;transition:transform .2s;}
    .liveStickerItem:hover{transform:scale(1.05);}
    .liveStickerItem img{width:100%;height:100%;object-fit:contain;}

    .streamChatArea{position:absolute;bottom:110px;left:12px;right:12px;max-height:200px;display:flex;flex-direction:column;gap:6px;z-index:7;pointer-events:none;}
</style>
<link rel="icon" type="image/x-icon" href="favicon.ico">

function showToast(msg, type="success"){
    const t=document.createElement("div");
    t.className="toast "+type;
    t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),3000);
}

function setMode(mode){
    currentMode = mode;
    document.querySelectorAll(".modeOption").forEach(function(btn){
        btn.classList.toggle("active", btn.dataset.mode === mode);
    });
}

function getStreamConstraints(){
    if(currentMode === "screen"){
        return null;
    }
    return {
        audio: true,
        video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
    };
}

async function startScreenShare(){
    try {
        const screenStream = await navigator.mediaDevices.getDisplayMedia({
            video: { cursor: "always" },
            audio: false
        });

        const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(function(){ return null; });

        const tracks = screenStream.getVideoTracks();
        if(audioStream){
            audioStream.getAudioTracks().forEach(function(t){ tracks.push(t); });
        }

        localStream = new MediaStream(tracks);

        screenStream.getVideoTracks()[0].onended = function(){
            if(isStreaming){
                switchBackToCamera();
            }
        };

        return true;
    } catch(e){
        showToast("Screen share cancelled or not supported", "error");
        return false;
    }
}

async function switchBackToCamera(){
    try {
        if(localStream){
            localStream.getTracks().forEach(function(t){ t.stop(); });
        }
        localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        document.getElementById("streamLocal").srcObject = localStream;
        document.getElementById("streamMainVideo").srcObject = localStream;
        isScreenSharing = false;
        document.getElementById("streamScreenBtn").classList.remove("active");
        showToast("Switched back to camera");
    } catch(e){
        showToast("Failed to switch camera", "error");
    }
}

async function getCameraStream(){
    try {
        localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
    } catch(e){
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } } });
            showToast("Microphone unavailable, streaming video only","error");
        } catch(e2){
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                showToast("Camera unavailable, streaming audio only","error");
            } catch(e3){
                showToast("Camera/microphone access required","error");
                return false;
            }
        }
    }
    return true;
}

document.getElementById("goLiveBtn").onclick = async function(){
    try {
    if(!localStorage.getItem("CloudTokToken")){
        showToast("Please login first","error");
        return;
    }

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        showToast("Camera/mic not supported. Use HTTPS.","error");
        return;
    }

    const title = document.getElementById("streamTitleInput").value.trim() || "Live Stream";

    if(currentMode === "screen"){
        const ok = await startScreenShare();
        if(!ok) return;
    } else {
        const ok = await getCameraStream();
        if(!ok) return;
    }

    document.getElementById("streamLocal").srcObject = localStream;
    document.getElementById("streamMainVideo").srcObject = localStream;

    if(currentMode === "screen"){
        document.getElementById("streamLocal").style.display = "none";
    } else {
        document.getElementById("streamLocal").style.display = "block";
    }

    const result = await CloudTokAPI.request("/live/create", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({title: title, mode: currentMode})
    });

    if(result && result.success){
        streamKey = result.stream_key;
        isStreaming = true;

        document.getElementById("startScreen").style.display = "none";
        document.getElementById("streamView").classList.add("active");
        document.getElementById("streamTitleDisplay").textContent = title;

        startSignalPoll();
        showToast("You are now live!");

        window.addEventListener("beforeunload", endStream);
    } else {
        showToast((result && result.error) || "Failed to start stream","error");
    }
    } catch(e) {
        console.error("[Live] Go Live error:", e);
        showToast("Error: " + (e.message || "Unknown error"), "error");
    }
};

function startSignalPoll(){
    let lastSignalId = 0;

    async function poll(){
        if(!isStreaming || !streamKey) return;
        try {
            const result = await CloudTokAPI.request("/webrtc/poll?after=" + lastSignalId);
            if(result && result.signals){
                for(const signal of result.signals){
                    if(signal.id > lastSignalId) lastSignalId = signal.id;

                    if(signal.type === "live-join"){
                        await handleViewerJoin(signal.from, signal.data);
                    } else if(signal.type === "live-leave"){
                        handleViewerLeave(signal.from);
                    } else if(signal.type === "live-ice-viewer"){
                        const viewer = viewerConnections.find(function(v){ return v.username === signal.from; });
                        if(viewer && signal.data && signal.data.candidate){
                            try {
                                if(viewer.pc.remoteDescription){
                                    await viewer.pc.addIceCandidate(new RTCIceCandidate(signal.data.candidate));
                                } else {
                                    if(!viewerIceQueues[signal.from]) viewerIceQueues[signal.from] = [];
                                    viewerIceQueues[signal.from].push(signal.data.candidate);
                                }
                            } catch(e){}
                        }
                    } else if(signal.type === "live-chat-viewer" && signal.data){
                        addStreamChatMessage(signal.data.username || signal.from || "viewer", signal.data.text || "");
                    } else if(signal.type === "stream_ended"){
                        showToast("Stream ended by admin");
                        endStream();
                    }
                }
            }

            try {
                var chatResult = await CloudTokAPI.request("/live/chat?stream_key=" + encodeURIComponent(streamKey) + "&after=" + lastStreamChatId);
                if(chatResult && chatResult.messages){
                    chatResult.messages.forEach(function(msg){
                        if(msg.id > lastStreamChatId) lastStreamChatId = msg.id;
                        if(msg.sender_username !== localStorage.getItem("CloudTokCurrentUser")){
                            addStreamChatMessage(msg.sender_username || "viewer", msg.text || "");
                        }
                    });
                }
            } catch(e){}
        } catch(e){}

        if(isStreaming){
            signalPollInterval = setTimeout(poll, 800);
        }
    }
    poll();
}

async function handleViewerJoin(viewerUsername, data){
    if(!localStream) return;

    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

    localStream.getTracks().forEach(function(track){
        pc.addTrack(track, localStream);
    });

    pc.onicecandidate = async function(e){
        if(e.candidate){
            try {
                await CloudTokAPI.request("/webrtc/signal", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        to_username: viewerUsername,
                        signal_type: "live-ice",
                        signal_data: { candidate: e.candidate.toJSON() }
                    })
                });
            } catch(err) {}
        }
    };

    pc.onconnectionstatechange = function(){
        if(pc.connectionState === "disconnected" || pc.connectionState === "failed"){
            handleViewerLeave(viewerUsername);
        }
    };

    viewerConnections.push({ username: viewerUsername, pc: pc });
    updateViewerCount();

    if(data && data.offer){
        try {
            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            await CloudTokAPI.request("/webrtc/signal", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    to_username: viewerUsername,
                    signal_type: "live-answer",
                    signal_data: { sdp: pc.localDescription.sdp, type: pc.localDescription.type }
                })
            });

            if(viewerIceQueues[viewerUsername] && viewerIceQueues[viewerUsername].length > 0){
                for(const c of viewerIceQueues[viewerUsername]){
                    try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch(e) {}
                }
                delete viewerIceQueues[viewerUsername];
            }
        } catch(e) {
            console.error("[Live] Failed to answer viewer:", e);
        }
    }
}

function handleViewerLeave(viewerUsername){
    const idx = viewerConnections.findIndex(function(v){ return v.username === viewerUsername; });
    if(idx !== -1){
        try { viewerConnections[idx].pc.close(); } catch(e){}
        viewerConnections.splice(idx, 1);
        updateViewerCount();
    }
    delete viewerIceQueues[viewerUsername];
}

function updateViewerCount(){
    document.getElementById("streamViewers").textContent = viewerConnections.length + " viewers";
}

            const screenStream = await navigator.mediaDevices.getDisplayMedia({
                video: { cursor: "always" },
                audio: false
            });

            const oldVideoTrack = localStream.getVideoTracks()[0];
            const newVideoTrack = screenStream.getVideoTracks()[0];

            localStream.removeTrack(oldVideoTrack);
            localStream.addTrack(newVideoTrack);
            oldVideoTrack.stop();

            newVideoTrack.onended = function(){
                if(isStreaming) switchBackToCamera();
            };

            document.getElementById("streamMainVideo").srcObject = localStream;
            document.getElementById("streamLocal").style.display = "none";
            isScreenSharing = true;
            document.getElementById("streamScreenBtn").classList.add("active");
            showToast("Screen sharing started");
        } catch(e){
            showToast("Screen share cancelled", "error");
        }
    }
};

document.getElementById("streamFlipBtn").onclick = async function(){
    if(currentMode === "screen" || !isStreaming) return;

    currentFacingMode = currentFacingMode === "user" ? "environment" : "user";

    try {
        const newStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
        });

        const oldTrack = localStream.getVideoTracks()[0];
        const newTrack = newStream.getVideoTracks()[0];

        localStream.removeTrack(oldTrack);
        localStream.addTrack(newTrack);
        oldTrack.stop();

        viewerConnections.forEach(function(v){
            const sender = v.pc.getSenders().find(function(s){ return s.track && s.track.kind === "video"; });
            if(sender) sender.replaceTrack(newTrack);
        });

        document.getElementById("streamMainVideo").srcObject = localStream;
        document.getElementById("streamLocal").srcObject = localStream;
        showToast("Camera flipped");
    } catch(e){
        showToast("Failed to flip camera", "error");
        currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
    }
};

async function loadActiveStreams(){
    try {
        const result = await CloudTokAPI.request("/live/streams");
        const streams = result.streams || [];
        const container = document.getElementById("activeStreams");
        if(streams.length === 0){
            container.innerHTML = '<p style="color:rgba(255,255,255,.3);font-size:13px;text-align:center;">No live streams right now</p>';
            return;
        }
        container.innerHTML = '<h3>Live Now</h3>';
        streams.forEach(function(s){
            const card = document.createElement("div");
            card.className = "streamCard";
            card.innerHTML = '<div class="liveDot" style="background:#ff2d55;"></div>' +
                '<div style="flex:1;">' +
                    '<div style="font-weight:600;font-size:14px;">' + (s.display_name||s.username) + '</div>' +
                    '<div style="color:rgba(255,255,255,.4);font-size:12px;">' + (s.title||"Live") + '</div>' +
                '</div>';
            container.appendChild(card);
        });
    } catch(e){
        document.getElementById("activeStreams").innerHTML = '<p style="color:rgba(255,255,255,.3);font-size:13px;text-align:center;">Live streams unavailable</p>';
    }
}

loadActiveStreams();
</script>
