<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forgot Password - CloudTok</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/settings.css">
<style>
.authPage{min-height:100vh;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.authCard{width:100%;max-width:400px;display:flex;flex-direction:column;gap:20px;}
.authCard h2{color:#fff;font-size:26px;text-align:center;}
.authCard p{color:rgba(255,255,255,.5);text-align:center;font-size:14px;}
.formGroup{display:flex;flex-direction:column;gap:6px;}
.formGroup label{color:rgba(255,255,255,.7);font-size:13px;font-weight:600;}
.formGroup input{
    width:100%;padding:14px 16px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
    border-radius:14px;color:#fff;font-size:15px;outline:none;
}
.formGroup input:focus{border-color:rgba(0,183,255,.5);}
.formGroup input::placeholder{color:rgba(255,255,255,.3);}
.submitBtn{
    width:100%;height:54px;border:none;border-radius:14px;
    background:linear-gradient(135deg,#00b7ff,#7b2ff2);
    color:#fff;font-size:17px;font-weight:700;cursor:pointer;
    transition:opacity .2s;
}
.submitBtn:disabled{opacity:.5;cursor:not-allowed;}
.backLink{color:rgba(255,255,255,.4);text-align:center;font-size:14px;}
.backLink a{color:#00b7ff;text-decoration:none;}
.codeInput{display:flex;gap:10px;justify-content:center;}
.codeInput input{width:50px;text-align:center;font-size:24px;padding:14px 8px;}
.verifySection{display:none;flex-direction:column;gap:16px;}
.successMsg{color:#00ff88;text-align:center;font-size:15px;display:none;}
.errorMsg{color:#ff2d55;text-align:center;font-size:13px;display:none;}
.passwordStrength{display:flex;gap:4px;margin-top:8px;}
.strengthBar{height:4px;flex:1;border-radius:2px;background:rgba(255,255,255,.1);transition:background .3s;}
.strengthBar.active.weak{background:#ff2d55;}
.strengthBar.active.medium{background:#ffc107;}
.strengthBar.active.strong{background:#00ff88;}
.strengthText{font-size:12px;color:rgba(255,255,255,.4);margin-top:4px;}
.codeDisplay{background:rgba(0,183,255,.1);border:1px solid rgba(0,183,255,.3);border-radius:10px;padding:16px;text-align:center;font-family:monospace;font-size:20px;font-weight:700;color:#00b7ff;margin:8px 0;letter-spacing:4px;cursor:pointer;transition:all .2s;word-break:break-all;}
.stepIndicator{display:flex;justify-content:center;gap:8px;margin-bottom:20px;}
.stepDot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);}
.stepDot.active{background:#00b7ff;}
.stepDot.done{background:#00ff88;}
</style>
</head>
<body>

<div class="authPage">
<div class="authCard">

<div class="stepIndicator">
    <div class="stepDot active" id="dot1"></div>
    <div class="stepDot" id="dot2"></div>
    <div class="stepDot" id="dot3"></div>
</div>

<div id="step1">
    <h2>Forgot Password</h2>
    <p>Enter your email address and we'll send you a verification code.</p>
    <div class="formGroup">
        <label>Email</label>
        <input type="email" id="resetEmail" placeholder="Enter your email">
    </div>
    <p id="errorMsg1" class="errorMsg"></p>
    <button class="submitBtn" id="sendCodeBtn">Send Code</button>
    <p class="backLink"><a href="login.html">Back to Login</a></p>
</div>

<div class="verifySection" id="step2">
    <h2>Enter Code</h2>
    <p id="codeDisplayTitle">Check your email for the code.</p>
    <div class="codeDisplay" id="codeDisplay"></div>
    <div class="codeInput">
        <input type="text" maxlength="1" class="codeDigit" data-index="0" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" class="codeDigit" data-index="1" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" class="codeDigit" data-index="2" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" class="codeDigit" data-index="3" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" class="codeDigit" data-index="4" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" class="codeDigit" data-index="5" inputmode="numeric" pattern="[0-9]">
    </div>
    <p id="errorMsg2" class="errorMsg"></p>
    <button class="submitBtn" id="verifyBtn">Verify Code</button>
    <p class="backLink">Didn't receive? <a href="#" id="resendBtn">Resend Code</a></p>
</div>

<div class="verifySection" id="step3">
    <h2>New Password</h2>
    <p>Create a strong password for your account.</p>
    <div class="formGroup">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password">
        <div class="passwordStrength" id="strengthBars">
            <div class="strengthBar"></div>
            <div class="strengthBar"></div>
            <div class="strengthBar"></div>
            <div class="strengthBar"></div>
        </div>
        <p class="strengthText" id="strengthText"></p>
    </div>
    <div class="formGroup">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password">
    </div>
    <p id="errorMsg3" class="errorMsg"></p>
    <p class="successMsg" id="successMsg">Password updated successfully! Redirecting to login...</p>
    <button class="submitBtn" id="resetBtn">Reset Password</button>
</div>

</div>
</div>

<script>
const API_BASE = "https://cloudtok-api.bossmanp16.workers.dev/api";
let resetToken = null;
let resetCode = null;

document.addEventListener("DOMContentLoaded", () => {
    const step1 = document.getElementById("step1");
    const step2 = document.getElementById("step2");
    const step3 = document.getElementById("step3");
    const codeDigits = document.querySelectorAll(".codeDigit");

    codeDigits.forEach((digit, i) => {
        digit.addEventListener("input", (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, "");
            if (e.target.value && i < 5) codeDigits[i + 1].focus();
        });
        digit.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" && !e.target.value && i > 0) codeDigits[i - 1].focus();
        });
    });

    document.getElementById("sendCodeBtn").addEventListener("click", async () => {
        const email = document.getElementById("resetEmail").value.trim();
        const errEl = document.getElementById("errorMsg1");
        const btn = document.getElementById("sendCodeBtn");

        if (!email) { errEl.textContent = "Please enter your email"; return; }

        errEl.textContent = "";
        btn.textContent = "Sending...";
        btn.disabled = true;

        try {
            const res = await fetch(API_BASE + "/auth/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email })
            });
            const data = await res.json();

            if (data.success || data.data) {
                const d = data.data || data;
                resetToken = d.token;
                resetCode = d.devCode;
                if (d.devCode) {
                    document.getElementById("codeDisplay").textContent = d.devCode;
                    document.getElementById("codeDisplay").style.color = "#ffc107";
                    document.getElementById("codeDisplayTitle").textContent = "Email not configured. Your code:";
                } else {
                    document.getElementById("codeDisplay").textContent = "Code sent to " + document.getElementById("resetEmail").value.trim();
                    document.getElementById("codeDisplay").style.color = "#00b7ff";
                    document.getElementById("codeDisplayTitle").textContent = "Check your email for the code.";
                }
                step1.style.display = "none";
                step2.style.display = "flex";
                document.getElementById("dot1").classList.add("done");
                document.getElementById("dot1").classList.remove("active");
                document.getElementById("dot2").classList.add("active");
                codeDigits[0].focus();
            } else {
                errEl.textContent = data.error || "Failed to send code";
            }
        } catch (err) {
            errEl.textContent = "Connection failed. Try again.";
        }

        btn.textContent = "Send Code";
        btn.disabled = false;
    });

    document.getElementById("verifyBtn").addEventListener("click", async () => {
        let entered = "";
        codeDigits.forEach(d => entered += d.value);
        const errEl = document.getElementById("errorMsg2");

        if (entered.length !== 6) { errEl.textContent = "Please enter the full 6-digit code"; return; }

        errEl.textContent = "";

        try {
            const res = await fetch(API_BASE + "/auth/verify-code", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token: resetToken, code: entered })
            });
            const data = await res.json();

            if (data.success || (data.data && data.data.verified)) {
                step2.style.display = "none";
                step3.style.display = "flex";
                document.getElementById("dot2").classList.add("done");
                document.getElementById("dot2").classList.remove("active");
                document.getElementById("dot3").classList.add("active");
            } else {
                errEl.textContent = data.error || "Invalid code. Try again.";
            }
        } catch (err) {
            errEl.textContent = "Connection failed. Try again.";
        }
    });

    document.getElementById("resendBtn").addEventListener("click", async (e) => {
        e.preventDefault();
        const email = document.getElementById("resetEmail").value.trim();

        try {
            const res = await fetch(API_BASE + "/auth/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email })
            });
            const data = await res.json();

            if (data.success || data.data) {
                const d = data.data || data;
                resetToken = d.token;
                resetCode = d.devCode;
                if (d.devCode) {
                    document.getElementById("codeDisplay").textContent = d.devCode;
                    document.getElementById("codeDisplay").style.color = "#ffc107";
                    document.getElementById("codeDisplayTitle").textContent = "Email not configured. Your code:";
                } else {
                    document.getElementById("codeDisplay").textContent = "Code resent to " + document.getElementById("resetEmail").value.trim();
                    document.getElementById("codeDisplay").style.color = "#00b7ff";
                    document.getElementById("codeDisplayTitle").textContent = "Check your email for the code.";
                }
                alert("New code sent!");
            }
        } catch (err) {
            alert("Failed to resend code.");
        }
    });

    document.getElementById("newPassword").addEventListener("input", (e) => {
        const pw = e.target.value;
        const bars = document.querySelectorAll("#strengthBars .strengthBar");
        const text = document.getElementById("strengthText");
        let strength = 0;

        if (pw.length >= 8) strength++;
        if (/[A-Z]/.test(pw)) strength++;
        if (/[0-9]/.test(pw)) strength++;
        if (/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~]/.test(pw)) strength++;

        const labels = ["", "Weak", "Fair", "Good", "Strong"];
        const classes = ["", "weak", "medium", "medium", "strong"];

        bars.forEach((bar, i) => {
            bar.classList.remove("active", "weak", "medium", "strong");
            if (i < strength) {
                bar.classList.add("active", classes[strength]);
            }
        });

        text.textContent = strength > 0 ? labels[strength] : "";
        text.style.color = strength >= 3 ? "#00ff88" : strength >= 2 ? "#ffc107" : "#ff2d55";
    });

    document.getElementById("resetBtn").addEventListener("click", async () => {
        const pw = document.getElementById("newPassword").value;
        const confirm = document.getElementById("confirmPassword").value;
        const errEl = document.getElementById("errorMsg3");
        const btn = document.getElementById("resetBtn");

        errEl.textContent = "";

        if (pw.length < 8) { errEl.textContent = "Password must be at least 8 characters"; return; }
        if (pw !== confirm) { errEl.textContent = "Passwords don't match"; return; }

        btn.textContent = "Resetting...";
        btn.disabled = true;

        let enteredCode = "";
        codeDigits.forEach(d => enteredCode += d.value);

        try {
            const res = await fetch(API_BASE + "/auth/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token: resetToken, code: enteredCode, newPassword: pw, confirmPassword: confirm })
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById("successMsg").style.display = "block";
                btn.style.display = "none";
                setTimeout(() => { window.location.href = "login.html"; }, 2000);
            } else {
                var errMsg = data.error || "Failed to reset password";
                if (data.code) errMsg += " [" + data.code + "]";
                errEl.textContent = errMsg;
                console.error("[ResetPassword] Error:", data);
            }
        } catch (err) {
            errEl.textContent = "Connection failed. Try again.";
        }

        btn.textContent = "Reset Password";
        btn.disabled = false;
    });
});
</script>

</body>
</html>
