<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CloudTok Admin</title>
<link rel="stylesheet" href="assets/css/base.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;}

.adminLoginGate{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0a0a0a;}
.adminLoginCard{background:#111;border:1px solid #222;border-radius:16px;padding:40px;width:100%;max-width:380px;margin:20px;}
.adminLoginLogo{font-size:24px;font-weight:700;text-align:center;margin-bottom:8px;color:#ff2d55;}
.adminLoginSub{text-align:center;color:#888;font-size:14px;margin-bottom:24px;}
#adminLoginForm{display:flex;flex-direction:column;gap:12px;}
#adminLoginForm input{padding:14px;border:1px solid #333;border-radius:10px;background:#1a1a1a;color:#fff;font-size:15px;outline:none;}
#adminLoginForm input:focus{border-color:#ff2d55;}
#adminLoginBtn{padding:14px;border:none;border-radius:10px;background:#ff2d55;color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .2s;}
#adminLoginBtn:disabled{opacity:.5;cursor:not-allowed;}
.adminLoginError{color:#ff2d55;text-align:center;font-size:13px;margin-top:12px;min-height:18px;}

.adminLayout{display:flex;min-height:100vh;}
.adminSidebar{width:220px;background:#111;border-right:1px solid #222;display:flex;flex-direction:column;padding:20px 0;position:fixed;height:100vh;overflow-y:auto;}
.adminLogo{font-size:18px;font-weight:700;padding:0 20px 20px;border-bottom:1px solid #222;color:#ff2d55;}
.adminSidebar nav{flex:1;padding:16px 0;}
.adminNav{display:flex;align-items:center;gap:10px;width:calc(100% - 24px);margin:0 12px;padding:10px 12px;border:none;background:none;color:#888;font-size:13px;text-align:left;cursor:pointer;border-radius:8px;transition:all .2s;}
.adminNav:hover{color:#fff;background:rgba(255,255,255,.05);}
.adminNav.active{color:#ff2d55;background:rgba(255,45,85,.1);}
.adminNav .icon{font-size:16px;width:20px;text-align:center;}
.adminLogout{margin:20px;padding:10px;background:rgba(255,255,255,.05);border:1px solid #333;color:#888;border-radius:8px;cursor:pointer;font-size:13px;}
.adminLogout:hover{color:#ff2d55;border-color:#ff2d55;}
.adminMain{flex:1;margin-left:220px;padding:30px;}
.adminTab{display:none;}
.adminTab.active{display:block;}
.adminTab h1{font-size:24px;margin-bottom:20px;font-weight:700;}

.statsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:30px;}
.statCard{background:#111;border:1px solid #222;border-radius:12px;padding:20px;text-align:center;}
.statNumber{font-size:32px;font-weight:700;color:#ff2d55;}
.statLabel{font-size:13px;color:#888;margin-top:4px;}

.adminTable{overflow-x:auto;}
.adminTable table{width:100%;border-collapse:collapse;background:#111;border-radius:12px;overflow:hidden;}
.adminTable th,.adminTable td{padding:12px 16px;text-align:left;border-bottom:1px solid #222;font-size:13px;}
.adminTable th{background:#1a1a1a;color:#888;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.5px;}
.adminTable td{color:#ddd;}
.adminTable tr:hover td{background:rgba(255,255,255,.03);}

.userCell{display:flex;align-items:center;gap:10px;}
.userCellAvatar{width:36px;height:36px;border-radius:50%;object-fit:cover;}

.videoPreviewThumb{width:60px;height:80px;border-radius:8px;overflow:hidden;cursor:pointer;background:#1a1a1a;display:flex;align-items:center;justify-content:center;transition:transform .2s;border:1px solid #333;}
.videoPreviewThumb:hover{transform:scale(1.05);border-color:#ff2d55;}
.videoPreviewThumb img{width:100%;height:100%;object-fit:cover;}

.adminBtn{padding:6px 12px;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-weight:600;transition:all .2s;}
.adminBtn.ban{background:rgba(255,45,85,.15);color:#ff2d55;}
.adminBtn.ban:hover{background:#ff2d55;color:#fff;}
.adminBtn.unban{background:rgba(0,200,83,.15);color:#00c853;}
.adminBtn.unban:hover{background:#00c853;color:#fff;}
.adminBtn.delete{background:rgba(255,255,255,.08);color:#888;}
.adminBtn.delete:hover{background:#ff4444;color:#fff;}
.adminBtn.stop{background:rgba(255,193,7,.15);color:#ffc107;}
.adminBtn.stop:hover{background:#ffc107;color:#000;}
.adminBtn.view{background:rgba(0,183,255,.15);color:#00b7ff;}
.adminBtn.view:hover{background:#00b7ff;color:#fff;}
.adminBtn.admin{background:rgba(138,43,226,.15);color:#8a2be2;}
.adminBtn.admin:hover{background:#8a2be2;color:#fff;}
.actionsCell{display:flex;gap:6px;flex-wrap:wrap;}

.statusBadge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;}
.statusBadge.active{background:rgba(0,200,83,.15);color:#00c853;}
.statusBadge.banned{background:rgba(255,45,85,.15);color:#ff2d55;}
.statusBadge.suspended{background:rgba(255,193,7,.15);color:#ffc107;}
.statusBadge.admin{background:rgba(138,43,226,.15);color:#8a2be2;}
.statusBadge.user{background:rgba(255,255,255,.08);color:#888;}
.statusBadge.online{background:rgba(0,200,83,.15);color:#00c853;}
.statusBadge.offline{background:rgba(255,255,255,.08);color:#888;}
.statusBadge.live{background:rgba(255,45,85,.2);color:#ff2d55;}

.searchBar{margin-bottom:16px;display:flex;gap:10px;}
.searchBar input{flex:1;padding:10px 14px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-size:14px;outline:none;}
.searchBar input:focus{border-color:#ff2d55;}
.refreshBtn{padding:10px 16px;background:rgba(255,255,255,.08);border:1px solid #333;color:#fff;border-radius:8px;cursor:pointer;font-size:13px;}
.refreshBtn:hover{background:rgba(255,255,255,.15);}

.msgPreview{max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#888;}
.commentText{max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.videoPreviewModal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(5px);}
.videoPreviewModal.show{display:flex;}
.videoPreviewContent{background:#111;border-radius:16px;overflow:hidden;max-width:400px;width:90%;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.videoPreviewContent video{width:100%;max-height:60vh;background:#000;display:block;}
.closePreviewBtn{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;z-index:10;}
.previewInfo{padding:16px;}
.previewInfo h3{font-size:16px;margin-bottom:6px;}
.previewInfo p{color:#888;font-size:13px;margin-bottom:10px;}
.previewStats{display:flex;gap:16px;font-size:13px;color:#aaa;}

.emptyState{text-align:center;padding:40px;color:#555;font-size:14px;}
.emptyState .icon{font-size:40px;margin-bottom:12px;}

@media(max-width:768px){
.adminSidebar{width:60px;padding:10px 0;}
.adminLogo{font-size:0;padding:0 10px 15px;text-align:center;}
.adminLogo::before{content:"🛡";font-size:18px;}
.adminNav{padding:10px;justify-content:center;font-size:0;}
.adminNav .icon{font-size:18px;}
.adminNav span:not(.icon){display:none;}
.adminLogout{padding:10px;font-size:0;text-align:center;}
.adminLogout::before{content:"🚪";font-size:16px;}
.adminMain{margin-left:60px;padding:15px;}
.statsGrid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<div id="adminLoginGate" class="adminLoginGate">
    <div class="adminLoginCard">
        <div class="adminLoginLogo">🛡️ CloudTok Admin</div>
        <p class="adminLoginSub">Enter your admin credentials to continue</p>
        <form id="adminLoginForm">
            <input id="adminEmail" type="email" placeholder="Email" required>
            <input id="adminPassword" type="password" placeholder="Password" required>
            <button type="submit" id="adminLoginBtn">Login</button>
        </form>
        <p id="adminLoginError" class="adminLoginError"></p>
    </div>
</div>

<div id="adminPanel" class="adminLayout" style="display:none">
    <aside class="adminSidebar">
        <div class="adminLogo">🛡️ Admin</div>
        <nav id="adminNav">
            <button class="adminNav active" data-tab="dashboard"><span class="icon">📊</span><span>Dashboard</span></button>
            <button class="adminNav" data-tab="users"><span class="icon">👥</span><span>Users</span></button>
            <button class="adminNav" data-tab="videos"><span class="icon">🎬</span><span>Videos</span></button>
            <button class="adminNav" data-tab="comments"><span class="icon">💬</span><span>Comments</span></button>
            <button class="adminNav" data-tab="messages"><span class="icon">✉️</span><span>Messages</span></button>
            <button class="adminNav" data-tab="streams"><span class="icon">📡</span><span>Live Streams</span></button>
            <button class="adminNav" data-tab="transactions"><span class="icon">💰</span><span>Transactions</span></button>
            <button class="adminNav" data-tab="gifts"><span class="icon">🎁</span><span>Gifts</span></button>
            <button class="adminNav" data-tab="logs"><span class="icon">📋</span><span>Activity Logs</span></button>
            <button class="adminNav" data-tab="storage"><span class="icon">🗄️</span><span>Storage</span></button>
        </nav>
        <button id="adminLogoutBtn" class="adminLogout">🚪 Logout</button>
    </aside>

    <main class="adminMain">
        <div id="dashboardTab" class="adminTab active">
            <h1>📊 Dashboard</h1>
            <div id="statsGrid" class="statsGrid"></div>
        </div>

        <div id="usersTab" class="adminTab">
            <h1>👥 Users</h1>
            <div class="searchBar"><input id="usersSearch" placeholder="Search users..."><button class="refreshBtn" onclick="admin.loadUsers()">Refresh</button></div>
            <div id="usersTable" class="adminTable"></div>
        </div>

        <div id="videosTab" class="adminTab">
            <h1>🎬 Videos</h1>
            <div class="searchBar"><input id="videosSearch" placeholder="Search videos..."><button class="refreshBtn" onclick="admin.loadVideos()">Refresh</button></div>
            <div id="videosTable" class="adminTable"></div>
        </div>

        <div id="commentsTab" class="adminTab">
            <h1>💬 Comments</h1>
            <div class="searchBar"><button class="refreshBtn" onclick="admin.loadComments()">Refresh</button></div>
            <div id="commentsTable" class="adminTable"></div>
        </div>

        <div id="messagesTab" class="adminTab">
            <h1>✉️ Messages</h1>
            <div class="searchBar"><button class="refreshBtn" onclick="admin.loadMessages()">Refresh</button></div>
            <div id="messagesTable" class="adminTable"></div>
        </div>

        <div id="streamsTab" class="adminTab">
            <h1>📡 Live Streams</h1>
            <div class="searchBar"><button class="refreshBtn" onclick="admin.loadStreams()">Refresh</button></div>
            <div id="streamsTable" class="adminTable"></div>
        </div>

        <div id="transactionsTab" class="adminTab">
            <h1>💰 Transactions</h1>
            <div class="searchBar"><button class="refreshBtn" onclick="admin.loadTransactions()">Refresh</button></div>
            <div id="transactionsTable" class="adminTable"></div>
        </div>

        <div id="giftsTab" class="adminTab">
            <h1>🎁 Gifts</h1>
            <div class="searchBar"><button class="refreshBtn" onclick="admin.loadGifts()">Refresh</button></div>
            <div id="giftsTable" class="adminTable"></div>
        </div>

        <div id="logsTab" class="adminTab">
            <h1>📋 Activity Logs</h1>
            <div class="searchBar"><button class="refreshBtn" onclick="admin.loadLogs()">Refresh</button></div>
            <div id="logsTable" class="adminTable"></div>
        </div>

        <div id="storageTab" class="adminTab">
            <h1>🗄️ Storage Health</h1>
            <div id="storageGrid" class="statsGrid"></div>
        </div>
    </main>
</div>

<div id="videoPreviewModal" class="videoPreviewModal">
    <div class="videoPreviewContent">
        <button id="closePreviewBtn" class="closePreviewBtn">✕</button>
        <video id="previewVideo" controls playsinline></video>
        <div id="previewInfo" class="previewInfo"></div>
    </div>
</div>

<script src="assets/js/admin/admin.js"></script>
</body>
</html>
