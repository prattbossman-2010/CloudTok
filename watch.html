0

<script src="assets/js/core/icons.js"></script>

<script src="assets/js/core/webrtc.js"></script>
<script src="assets/js/core/callPoller.js"></script>
<script>
(function(){
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get("id");
    if(videoId && typeof CloudTokAPI !== "undefined"){
        CloudTokAPI.request("/videos/"+videoId+"/view", {method:"POST"}).catch(()=>{});
    }
    function updateOG(caption, username, views, likes){
        if(caption){
            document.title = caption + " - CloudTok";
            document.querySelector('meta[property="og:title"]').setAttribute("content", caption + " - CloudTok");
            document.querySelector('meta[property="og:description"]').setAttribute("content", "Watch @" + username + " on CloudTok. " + (views||0) + " views, " + (likes||0) + " likes.");
        }
        var ogImg = document.querySelector('meta[property="og:image"]');
        if(ogImg) ogImg.setAttribute("content", window.CloudTokAPI.baseURL.replace("/api","") + "/api/og?id=" + videoId + "&title=" + encodeURIComponent(caption||"CloudTok Video") + "&user=" + encodeURIComponent(username||"") + "&views=" + (views||0) + "&likes=" + (likes||0));
    }
    window.updateWatchOG = updateOG;
})();
</script>

</body>
