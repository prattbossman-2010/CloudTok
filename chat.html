<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">
<title>CloudTok Chat</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/chat.css">
</head>

<body>

<div id="chatPage">

    <div class="chatHeader">
        <button id="chatBackBtn">←</button>
        <h2>Messages</h2>
        <button id="newChatBtn" class="newChatFab">✏️</button>
    </div>

    <div class="chatSearch">
        <input
        id="chatSearchInput"
        type="text"
        placeholder="Search conversations...">
    </div>

    <div id="conversationList" class="conversationList"></div>

</div>

<!-- New Chat User Selection Overlay -->
<div id="newChatOverlay" class="newChatOverlay" style="display:none">
    <div class="newChatHeader">
        <button id="closeNewChatBtn">←</button>
        <h2>New Chat</h2>
    </div>
    <div class="newChatSearch">
        <input id="newChatSearchInput" type="text" placeholder="Search users...">
    </div>
    <div id="newChatUserList" class="newChatUserList"></div>
</div>

<script src="assets/js/api/api.js"></script>
<script src="assets/js/database/database.js"></script>
<script src="assets/js/database/users.js"></script>
<script src="assets/js/chat/chat.js"></script>

</body>
</html>
