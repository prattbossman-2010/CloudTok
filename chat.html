<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat - CloudTok</title>
<meta name="description" content="Chat with friends and creators on CloudTok. Send messages and connect with the community.">
<meta property="og:title" content="Chat - CloudTok">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/chat.css">
</head>

<body>

<div id="chatPage">

    <div class="chatHeader">
        <button id="chatBackBtn"><span class="icon" style="width:1em;height:1em;display:inline-flex;vertical-align:middle;">CloudTokIcons.back</span></button>
        <h2>Messages</h2>
        <button id="newChatBtn" class="newChatFab" onclick="document.getElementById('newChatOverlay').style.display='flex';document.getElementById('newChatUserList').innerHTML='';"><span class="icon" style="width:1em;height:1em;display:inline-flex;vertical-align:middle;">CloudTokIcons.pencil</span></button>
    </div>

    <div class="chatSearch">
        <input id="chatSearchInput" type="text" placeholder="Search conversations...">
    </div>

    <div id="conversationList" class="conversationList"></div>

</div>

<div id="newChatOverlay" class="newChatOverlay" style="display:none">
    <div class="newChatHeader">
        <button onclick="document.getElementById('newChatOverlay').style.display='none';"><span class="icon" style="width:1em;height:1em;display:inline-flex;vertical-align:middle;">CloudTokIcons.back</span></button>
        <h2>New Chat</h2>
    </div>
    <div class="newChatSearch">
        <input id="newChatSearchInput" type="text" placeholder="Search users...">
    </div>
    <div id="newChatUserList" class="newChatUserList"></div>
</div>

<script src="assets/js/core/icons.js"></script>
<script src="assets/js/api/api.js"></script>
<script src="assets/js/database/database.js"></script>
<script src="assets/js/chat/chat.js"></script>
<script src="assets/js/core/webrtc.js"></script>
<script src="assets/js/core/callPoller.js"></script>

</body>
</html>
