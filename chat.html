<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat - CloudTok</title>
<meta name="description" content="Chat with friends and creators on CloudTok. Send messages and connect with the community.">
<meta property="og:title" content="Chat - CloudTok">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/chat.css">
<link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>

<div id="chatPage">

    <div class="chatHeader">
        <button id="chatBackBtn">←</button>
        <h2>Messages</h2>
        <button id="newChatBtn" class="newChatFab" onclick="document.getElementById('newChatOverlay').style.display='flex';document.getElementById('newChatUserList').innerHTML='';">✏️</button>
    </div>

    <div class="chatSearch">
        <input id="chatSearchInput" type="text" placeholder="Search conversations...">
    </div>

    <div id="conversationList" class="conversationList"></div>

    <div class="msgSelectBar" id="chatSelectBar">
        <span class="selCount" id="chatSelCount">0 selected</span>
        <div class="msgSelectActions">
            <button id="chatSelDeleteBtn" class="danger">🗑 Delete</button>
            <button id="chatSelCancelBtn">✕ Cancel</button>
        </div>
    </div>

</div>

<div id="newChatOverlay" class="newChatOverlay" style="display:none">
    <div class="newChatHeader">
        <button onclick="document.getElementById('newChatOverlay').style.display='none';">←</button>
        <h2>New Chat</h2>
    </div>
    <div class="newChatSearch">
        <input id="newChatSearchInput" type="text" placeholder="Search users...">
    </div>
    <div id="newChatUserList" class="newChatUserList"></div>
</div>

<script src="assets/js/api/api.js"></script>
<script src="assets/js/database/database.js"></script>
<script src="assets/js/components/toast.js"></script>
<script src="assets/js/chat/chat.js"></script>
<script src="assets/js/core/webrtc.js"></script>
<script src="assets/js/core/callPoller.js"></script>

</body>
</html>
