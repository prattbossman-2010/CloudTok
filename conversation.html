<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Conversation</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/chat.css">
<style>
.conversationPage{position:relative;}

.messageBar{position:relative;}

.emojiBar{display:none;flex-direction:column;gap:4px;padding:8px 12px;position:absolute;bottom:100%;left:0;right:0;max-height:200px;overflow-y:auto;background:#111;border-top:1px solid rgba(255,255,255,.08);z-index:50;}
.emojiBar.show{display:flex;}
.emojiBar .emojiRow{display:flex;gap:4px;flex-wrap:wrap;}
.emojiBar .emojiRow button{background:none;border:none;font-size:24px;cursor:pointer;padding:6px;border-radius:8px;transition:background .2s;flex-shrink:0;color:#fff;}
.emojiBar .emojiRow button:hover{background:rgba(255,255,255,.08);}

.emojiToggleBtn{background:none !important;border:none !important;color:rgba(255,255,255,.5) !important;font-size:20px !important;cursor:pointer !important;padding:8px !important;border-radius:8px !important;font-weight:normal !important;}
.emojiToggleBtn:hover{color:#fff !important;}

.gifToggleBtn{background:none !important;border:none !important;color:rgba(255,255,255,.5) !important;font-size:14px !important;font-weight:600 !important;cursor:pointer !important;padding:8px !important;border-radius:8px !important;}
.gifToggleBtn:hover{color:#fff !important;}

.gifPanel{display:none;position:absolute;bottom:100%;left:0;right:0;background:#111;border-top:1px solid rgba(255,255,255,.08);max-height:300px;overflow-y:auto;padding:10px;z-index:50;}
.gifPanel.show{display:block;}
.gifGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.gifItem{border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:1;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:40px;transition:transform .2s;}
.gifItem:hover{transform:scale(1.05);}
.gifItem img{width:100%;height:100%;object-fit:cover;border-radius:10px;}
.gifSearch{width:100%;padding:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:10px;color:#fff;font-size:14px;margin-bottom:10px;outline:none;}
.gifSearch::placeholder{color:rgba(255,255,255,.3);}
.createGifBtn{width:100%;padding:10px;background:rgba(255,45,85,.15);border:1px dashed rgba(255,45,85,.4);border-radius:10px;color:#ff2d55;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:10px;text-align:center;transition:background .2s;}
.createGifBtn:hover{background:rgba(255,45,85,.25);}

.stickerToggleBtn{background:none !important;border:none !important;color:rgba(255,255,255,.5) !important;font-size:14px !important;font-weight:600 !important;cursor:pointer !important;padding:8px !important;border-radius:8px !important;}
.stickerToggleBtn:hover{color:#fff !important;}

.stickerPanel{display:none;position:absolute;bottom:100%;left:0;right:0;background:#111;border-top:1px solid rgba(255,255,255,.08);max-height:300px;overflow-y:auto;padding:10px;z-index:50;}
.stickerPanel.show{display:block;}
.stickerGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.stickerItem{border-radius:10px;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;aspect-ratio:1;transition:transform .2s;}
.stickerItem:hover{transform:scale(1.05);}
.stickerItem img{width:100%;height:100%;object-fit:contain;}

.callBtns{display:flex;gap:4px;}
.callBtn{background:none !important;border:none !important;font-size:18px !important;cursor:pointer !important;padding:6px 8px !important;border-radius:8px !important;color:#fff !important;}
.callBtn:hover{background:rgba(255,255,255,.08) !important;}
@media(min-width:769px){
.callBtn{font-size:26px !important;padding:10px 14px !important;}
}

.callOverlay{display:none;position:fixed;inset:0;background:#000;z-index:999;flex-direction:column;align-items:center;justify-content:center;}
.callOverlay.active{display:flex;}
.callVideoContainer{width:100%;max-width:500px;aspect-ratio:3/4;background:#111;border-radius:20px;overflow:hidden;position:relative;}
.callVideoContainer video{width:100%;height:100%;object-fit:cover;}
.callVideoContainer .remoteVideo{position:absolute;inset:0;}
.callVideoContainer .localVideo{position:absolute;bottom:16px;right:16px;width:120px;height:160px;border-radius:12px;border:2px solid #fff;z-index:2;}
.callInfo{margin-top:20px;text-align:center;}
.callInfo h3{color:#fff;font-size:18px;margin:0;}
.callInfo p{color:rgba(255,255,255,.5);font-size:14px;margin:6px 0 0;}
.callActions{display:flex;gap:16px;margin-top:24px;}
.callActionBtn{width:60px;height:60px;border-radius:50%;border:none;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.callActionBtn.end{background:#ff2d55;color:#fff;}
.callActionBtn.mute{background:rgba(255,255,255,.15);color:#fff;}
.callActionBtn.video-toggle{background:rgba(255,255,255,.15);color:#fff;}
.callActionBtn.accept{background:#00c853;color:#fff;}
.callStatusBadge{position:fixed;top:10px;right:10px;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600;z-index:1000;}
.callStatusBadge.connected{background:#00c853;color:#fff;}
.callStatusBadge.disconnected{background:rgba(255,255,255,.15);color:rgba(255,255,255,.5);}
.callError{color:#ff2d55;font-size:14px;margin-top:10px;text-align:center;}
.mediaFallback{display:none;flex-direction:column;align-items:center;gap:8px;padding:16px;background:rgba(255,255,255,.05);border-radius:12px;margin-top:12px;}
.mediaFallback.show{display:flex;}
.mediaFallback p{color:rgba(255,255,255,.6);font-size:13px;margin:0;text-align:center;}
.mediaFallback button{background:#fe2c55;color:#fff;border:none;padding:10px 20px;border-radius:20px;font-weight:600;cursor:pointer;}

.convGiftBtn{background:none !important;border:none !important;color:rgba(255,255,255,.5) !important;font-size:18px !important;cursor:pointer !important;padding:8px !important;border-radius:8px !important;}
.convGiftBtn:hover{color:#ff2d55 !important;}

.convGiftPanel{display:none;position:absolute;bottom:100%;left:0;right:0;background:#111;border-top:1px solid rgba(255,255,255,.08);max-height:320px;overflow-y:auto;padding:12px;z-index:50;}
.convGiftPanel.show{display:block;}
.convGiftPanelTitle{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;}
.convGiftBalance{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:8px;}
.convGiftGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.convGiftItem{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;background:rgba(255,255,255,.06);border-radius:12px;cursor:pointer;border:2px solid transparent;transition:all .2s;}
.convGiftItem:hover{background:rgba(255,255,255,.1);border-color:rgba(255,45,85,.3);}
.convGiftItem.selected{border-color:#ff2d55;background:rgba(255,45,85,.15);}
.convGiftEmoji{font-size:28px;}
.convGiftName{font-size:10px;color:rgba(255,255,255,.7);}
.convGiftPrice{font-size:11px;color:#ff2d55;font-weight:700;}
.convGiftSendBtn{width:100%;margin-top:8px;padding:10px;background:#ff2d55;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;}
.convGiftSendBtn:disabled{opacity:.4;cursor:not-allowed;}

.giftAnimFloat{position:fixed;bottom:200px;left:50%;transform:translateX(-50%);font-size:60px;z-index:9999;pointer-events:none;animation:giftFloatConv 2s ease-out forwards;}
@keyframes giftFloatConv{0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}100%{opacity:0;transform:translateX(-50%) translateY(-200px) scale(1.5);}}
</style>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/twemoji@14/dist/twemoji.min.js"></script>
</head>
<body>
<div class="conversationPage">
    <div class="conversationHeader">
        <button id="conversationBackBtn">←</button>
        <img id="conversationAvatar" class="conversationAvatar" src="assets/images/default-avatar.png">
        <h2 id="conversationName">Loading...</h2>
        <div class="callBtns">
            <button class="callBtn" id="voiceCallBtn">📞</button>
            <button class="callBtn" id="videoCallBtn">📹</button>
        </div>
    </div>

    <div id="messageList" class="messageList"></div>

    <div class="messageBar">
        <button class="emojiToggleBtn" id="emojiToggleBtn">😊</button>
        <button class="gifToggleBtn" id="gifToggleBtn">GIF</button>
        <button class="stickerToggleBtn" id="stickerToggleBtn">😀</button>
        <button class="convGiftBtn" id="convGiftBtn">🎁</button>
        <input id="messageInput" type="text" placeholder="Type a message...">
        <button id="sendMessageBtn">Send</button>

        <div class="emojiBar" id="emojiBar">
            <div class="emojiRow" id="emojiRow"></div>
        </div>

        <div class="gifPanel" id="gifPanel">
            <button class="createGifBtn" id="createGifBtn">+ Create GIF</button>
            <input class="gifSearch" id="gifSearch" placeholder="Search GIFs...">
            <div class="gifGrid" id="gifGrid"></div>
            <input type="file" id="gifFileInput" accept="image/gif" style="display:none;">
        </div>

        <div class="stickerPanel" id="stickerPanel">
            <div class="stickerGrid" id="stickerGrid"></div>
        </div>

        <div class="convGiftPanel" id="convGiftPanel">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <div class="convGiftPanelTitle">Send a Gift</div>
                <button onclick="document.getElementById('convGiftPanel').classList.remove('show')" style="background:none;border:none;color:rgba(255,255,255,.4);font-size:18px;cursor:pointer;padding:4px 8px;">✕</button>
            </div>
            <div class="convGiftBalance" id="convGiftBalance">Balance: $0.00</div>
            <div class="convGiftGrid" id="convGiftGrid"></div>
            <button class="convGiftSendBtn" id="convGiftSendBtn" disabled>Select a gift</button>
        </div>
    </div>
</div>

<div class="callOverlay" id="callOverlay">
    <div class="callVideoContainer">
        <video class="remoteVideo" id="remoteVideo" autoplay playsinline></video>
        <video class="localVideo" id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="callInfo">
        <h3 id="callName">Calling...</h3>
        <p id="callStatus">Connecting...</p>
        <div class="callError" id="callError"></div>
        <div class="mediaFallback" id="mediaFallback">
            <p id="mediaFallbackMsg">Microphone unavailable. Your call will connect but without audio.</p>
            <button id="mediaFallbackBtn">Call Without Audio</button>
        </div>
    </div>
    <div class="callActions">
        <button class="callActionBtn mute" id="muteBtn">🎤</button>
        <button class="callActionBtn video-toggle" id="videoToggleBtn">📷</button>
        <button class="callActionBtn end" id="endCallBtn">📞</button>
    </div>
</div>

<div class="callStatusBadge disconnected" id="callStatusBadge">Calls unavailable</div>

<div class="msgSelectBar" id="msgSelectBar">
    <span class="selCount" id="selCount">0 selected</span>
    <div class="msgSelectActions">
        <button id="selDeleteBtn" class="danger">🗑 Delete</button>
        <button id="selArchiveBtn">📦 Archive</button>
        <button id="selLockBtn">🔒 Lock</button>
        <button id="selCancelBtn">✕ Cancel</button>
    </div>
</div>

<script src="assets/js/database/database.js"></script>
<script src="assets/js/api/api.js"></script>
<script src="assets/js/components/toast.js"></script>
<script src="assets/js/core/webrtc.js"></script>
<script src="assets/js/chat/conversation.js"></script>
<script>
(function(){
    const params = new URLSearchParams(window.location.search);
    const chatUsername = params.get("user");
    if(!chatUsername) return;

    const webrtc = window.CloudTokWebRTC;
    const badge = document.getElementById("callStatusBadge");
    let isMuted = false;
    let isVideoOff = false;
    let pendingCallData = null;

    const twemojiShortcodes = ["grinning","smiley","heart_eyes","kissing_heart","smirk","sunglasses","tongue","cry","scream","rage","persevere","disappointed","fearful","weary","sweat_smile","triumph","relaxed","yum","beer","wine","confused","expressionless","unamused","pensive","confounded","kissing","kissing_cat","stuck_out_tongue","open_mouth","hushed","no_mouth","mask","smile","laughing","satisfied","innocent","heart","love","broken_heart","two_hearts","sparkling_heart","cupid","revolving_hearts","heart_decoration","heartpulse","sparkles","star","stars","fire","droplet","dash","oops","virus","cat","dog","mouse","hamster","rabbit","wolf","frog","tiger","koala","bear","pig","penguin","bird","baby","thumbsup","thumbsdown","gift","balloon","party_popper","confetti_ball","tada","volcano","moon","sun_with_face","cloud","snow_cloud","snowman","zap","cyclone","foggy","ocean","dove","tulip","rose","hibiscus","sunflower","blossom","corn","earth_americas","earth_africa","earth_asia","globe_with_meridians","cherry_blossom","snow_capped_mountain","mountain"];
    const emojiBar = document.getElementById("emojiBar");
    const emojiRow = document.getElementById("emojiRow");
    const input = document.getElementById("messageInput");
    const gifPanel = document.getElementById("gifPanel");
    const gifGrid = document.getElementById("gifGrid");
    const stickerPanel = document.getElementById("stickerPanel");
    const stickerGrid = document.getElementById("stickerGrid");

    function renderEmojiGrid(){
        emojiRow.innerHTML="";
        twemojiShortcodes.forEach(function(code){
            var btn = document.createElement("button");
            btn.innerHTML = twemoji.parse(":" + code + ":");
            btn.addEventListener("click", function(ev){
                ev.stopPropagation();
                input.value += ":" + code + ":";
                setTimeout(function(){ twemoji.parse(input); }, 50);
                input.focus();
            });
            emojiRow.appendChild(btn);
        });
    }
    renderEmojiGrid();

    var emojiToggleBtn = document.getElementById("emojiToggleBtn");
    var gifToggleBtn = document.getElementById("gifToggleBtn");
    var stickerToggleBtn = document.getElementById("stickerToggleBtn");

    emojiToggleBtn.addEventListener("click", function(ev){
        ev.stopPropagation();
        var isOpen = emojiBar.classList.toggle("show");
        gifPanel.classList.remove("show");
        stickerPanel.classList.remove("show");
        if(isOpen && twemoji) twemoji.parse(document.body);
    });

    gifToggleBtn.addEventListener("click", function(ev){
        ev.stopPropagation();
        var isOpen = gifPanel.classList.toggle("show");
        emojiBar.classList.remove("show");
        stickerPanel.classList.remove("show");
        if(isOpen) loadCommunityGIFs();
    });

    stickerToggleBtn.addEventListener("click", function(ev){
        ev.stopPropagation();
        var isOpen = stickerPanel.classList.toggle("show");
        emojiBar.classList.remove("show");
        gifPanel.classList.remove("show");
        if(isOpen) renderStickerGrid();
    });

    emojiBar.addEventListener("click", function(ev){ ev.stopPropagation(); });
    gifPanel.addEventListener("click", function(ev){ ev.stopPropagation(); });
    stickerPanel.addEventListener("click", function(ev){ ev.stopPropagation(); });
    document.getElementById("convGiftPanel").addEventListener("click", function(ev){ ev.stopPropagation(); });

    document.addEventListener("click", function(){
        emojiBar.classList.remove("show");
        gifPanel.classList.remove("show");
        stickerPanel.classList.remove("show");
        document.getElementById("convGiftPanel").classList.remove("show");
    });

    var gifDebounce = null;
    document.getElementById("gifSearch").addEventListener("input", function(){
        clearTimeout(gifDebounce);
        gifDebounce = setTimeout(function(){
            var q = document.getElementById("gifSearch").value.trim();
            if(q) searchTenorGIFs(q);
            else loadCommunityGIFs();
        }, 400);
    });

    function searchTenorGIFs(query){
        gifGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:rgba(255,255,255,.3);padding:20px;">Loading...</div>';
        try {
            var apiKey = "AIzaSyBBJFS7BYOhPz2G0JnZpjfHfVWnKg1mFNI";
            fetch("https://tenor.googleapis.com/v2/search?key=" + apiKey + "&q=" + encodeURIComponent(query) + "&limit=20&media_filter=gif,tinygif&contentfilter=medium")
            .then(function(r){ return r.json(); })
            .then(function(data){
                var results = data.results || [];
                gifGrid.innerHTML = "";
                if(results.length === 0){ gifGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:rgba(255,255,255,.3);padding:20px;">No GIFs found</div>'; return; }
                results.forEach(function(gif){
                    var url = (gif.media_formats && gif.media_formats.gif) ? gif.media_formats.gif.url : "";
                    if(!url) return;
                    var item = document.createElement("div");
                    item.className = "gifItem";
                    var img = document.createElement("img");
                    img.src = url;
                    item.appendChild(img);
                    item.addEventListener("click", function(){ input.value = url; gifPanel.classList.remove("show"); input.focus(); });
                    gifGrid.appendChild(item);
                });
            })
            .catch(function(){ gifGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:rgba(255,255,255,.3);padding:20px;">GIFs unavailable</div>'; });
        } catch(e) {
            gifGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:rgba(255,255,255,.3);padding:20px;">GIFs unavailable</div>';
        }
    }

    function loadCommunityGIFs(){
        gifGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:rgba(255,255,255,.3);padding:20px;">Loading...</div>';
        var grid = document.getElementById("gifGrid");
        grid.innerHTML = "";
        var gifFiles = [
            "950522-pepehacker.gif","915177-alarm-dancing-cat.gif","897960-cateating.gif","828203-peperich.gif",
            "827729-peperain.gif","637105-cat-pat.gif","457711-screamingcat.gif","436131-pepetorchfire.gif",
            "431882-pepeclap.gif","429492-catjamming.gif","399137-mlady.gif","353772-karentyping.gif",
            "249299-strongpepe.gif","24137-okpepe.gif","175472-pepelaugh.gif","121023-pepetyping.gif"
        ];
        if(gifFiles.length === 0){
            grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:rgba(255,255,255,.3);padding:20px;">No local GIFs</div>';
            return;
        }
        gifFiles.forEach(function(fname){
            var url = "GIFs/" + fname;
            var item = document.createElement("div");
            item.className = "gifItem";
            var img = document.createElement("img");
            img.src = url;
            img.onerror = function(){ this.parentElement.innerHTML = "&#127647;"; this.style.display = "none"; };
            item.appendChild(img);
            item.addEventListener("click", function(){ input.value = url; gifPanel.classList.remove("show"); input.focus(); });
            grid.appendChild(item);
        });
    }

    function renderStickerGrid(){
        stickerGrid.innerHTML = "";
        var stickerFiles = [
            "974580-pepeok.png","877975-praypepe.png","850361-tiredcat.png","830563-pepe.png",
            "798781-nou.png","795083-pepehappy.png","774627-shhhhh.png","733150-kingpepe.png",
            "718017-pepestaring.png","717911-cat-stare.png","702336-kingpepe.png","618704-pepeokay.png",
            "606832-pepesadbusiness.png","415052-cat-mog.png","408164-pepecook.png","299063-nerdcat.png",
            "273026-catcried.png","236705-pepedumb.png","226280-catnoted.png","182109-pepeperfect.png",
            "152946-pepecashcow.png","149743-pepeheart.png","147423-baddie.png","140206-catgoodjob.png",
            "121286-crying.png","120458-pepecross.png"
        ];
        stickerFiles.forEach(function(fname){
            var url = "stickers/" + fname;
            var item = document.createElement("div");
            item.className = "stickerItem";
            var img = document.createElement("img");
            img.src = url;
            img.onerror = function(){ this.parentElement.innerHTML = "&#128516;"; };
            item.appendChild(img);
            item.addEventListener("click", function(ev){
                ev.stopPropagation();
                input.value += "[sticker:" + fname.split(".")[0] + "]";
                input.focus();
                stickerPanel.classList.remove("show");
            });
            stickerGrid.appendChild(item);
        });
    }

    document.getElementById("createGifBtn").addEventListener("click", function(ev){
        ev.stopPropagation();
        document.getElementById("gifFileInput").click();
    });

    document.getElementById("gifFileInput").addEventListener("change", function(e){
        var file = e.target.files[0];
        if(!file) return;
        if(file.size > 5 * 1024 * 1024){ alert("GIF must be under 5MB"); return; }
        var btn = document.getElementById("createGifBtn");
        btn.textContent = "Uploading...";
        btn.disabled = true;
        var form = new FormData();
        form.append("gif", file);
        CloudTokAPI.request("/gifs/upload", { method: "POST", body: form }).then(function(result){
            if(result && result.url){ input.value = result.url; gifPanel.classList.remove("show"); loadCommunityGIFs(); }
            else { alert((result && result.error) || "Upload failed"); }
        }).catch(function(){ alert("Upload failed"); }).finally(function(){
            btn.textContent = "+ Create GIF"; btn.disabled = false; e.target.value = "";
        });
    });

    function showCallOverlay(name, statusText){
        document.getElementById("callName").textContent = name;
        document.getElementById("callStatus").textContent = statusText;
        document.getElementById("callError").textContent = "";
        document.getElementById("mediaFallback").classList.remove("show");
        document.getElementById("callOverlay").classList.add("active");
    }

    function hideCallOverlay(){
        document.getElementById("callOverlay").classList.remove("active");
        document.getElementById("remoteVideo").srcObject = null;
        document.getElementById("localVideo").srcObject = null;
        document.getElementById("callError").textContent = "";
        document.getElementById("mediaFallback").classList.remove("show");
    }

    function showCallError(msg){ document.getElementById("callError").textContent = msg; }

    webrtc.onRemoteStream = function(stream) {
        var videoEl = document.getElementById("remoteVideo");
        videoEl.srcObject = stream; videoEl.play().catch(function(){});
    };
    webrtc.onCallEnd = function(){ hideCallOverlay(); webrtc.startPolling(chatUsername); };
    webrtc.onAnswerReceived = function(){ document.getElementById("callStatus").textContent = "Connected"; };
    webrtc.onConnectionStateChange = function(state){
        var el = document.getElementById("callStatus");
        if(state === "connected" || state === "completed") el.textContent = "Connected";
        else if(state === "connecting") el.textContent = "Connecting...";
        else if(state === "failed"){ el.textContent = "Call failed"; showCallError("Connection failed. Try again."); }
        else if(state === "disconnected") el.textContent = "Reconnecting...";
    };

    document.getElementById("voiceCallBtn").addEventListener("click", function(){ startCall(false); });
    document.getElementById("videoCallBtn").addEventListener("click", function(){ startCall(true); });
    document.getElementById("endCallBtn").addEventListener("click", function(){ webrtc.endCall(true); });
    document.getElementById("muteBtn").addEventListener("click", function(){
        isMuted = !isMuted;
        if(webrtc.localStream) webrtc.localStream.getAudioTracks().forEach(function(t){ t.enabled = !isMuted; });
        document.getElementById("muteBtn").textContent = isMuted ? "🔇" : "🎤";
    });
    document.getElementById("videoToggleBtn").addEventListener("click", function(){
        isVideoOff = !isVideoOff;
        if(webrtc.localStream) webrtc.localStream.getVideoTracks().forEach(function(t){ t.enabled = !isVideoOff; });
        document.getElementById("videoToggleBtn").textContent = isVideoOff ? "📷" : "📹";
    });

    async function startCall(video){
        if(!localStorage.getItem("CloudTokToken")){ alert("Please login first"); return; }
        showCallOverlay(chatUsername, "Requesting access...");
        var stream = await webrtc.startLocalStream(video);
        if(!stream){ proceedCallWithoutMedia(video); return; }
        document.getElementById("localVideo").srcObject = stream;
        document.getElementById("callStatus").textContent = "Calling...";
        var ok = await webrtc.initiateCall(chatUsername, video);
        if(!ok){ showCallError("Failed to start call."); document.getElementById("callStatus").textContent = "Call failed"; return; }
        document.getElementById("callStatus").textContent = "Ringing...";
    }

    async function proceedCallWithoutMedia(video){
        document.getElementById("callStatus").textContent = "Calling (no audio)...";
        webrtc.isInCall = true; webrtc._targetUsername = chatUsername; webrtc.isInitiator = true; webrtc.iceCandidateQueue = [];
        webrtc.createPeerConnection();
        try {
            var offer = await webrtc.pc.createOffer();
            await webrtc.pc.setLocalDescription(offer);
            await webrtc.sendSignal("call-offer", { sdp: webrtc.pc.localDescription.sdp, type: webrtc.pc.localDescription.type, video: false });
            document.getElementById("callStatus").textContent = "Ringing..."; webrtc.startPolling(chatUsername);
        } catch(e){ showCallError("Failed to start call."); document.getElementById("callStatus").textContent = "Call failed"; }
    }

    async function answerCall(from, callData){
        showCallOverlay(from, "Connecting...");
        var video = callData.video !== false;
        var stream = await webrtc.startLocalStream(video);
        if(!stream) document.getElementById("localVideo").srcObject = null;
        else document.getElementById("localVideo").srcObject = stream;
        webrtc.isInCall = true; webrtc._targetUsername = from; webrtc.createPeerConnection();
        try {
            await webrtc.pc.setRemoteDescription(new RTCSessionDescription({ sdp: callData.sdp, type: callData.type }));
            for(var i = 0; i < webrtc.iceCandidateQueue.length; i++){
                try { await webrtc.pc.addIceCandidate(new RTCIceCandidate(webrtc.iceCandidateQueue[i])); } catch(e) {}
            }
            webrtc.iceCandidateQueue = [];
            var answer = await webrtc.pc.createAnswer();
            await webrtc.pc.setLocalDescription(answer);
            await webrtc.sendSignal("call-answer", { sdp: answer.sdp, type: answer.type });
            document.getElementById("callStatus").textContent = "Connected";
        } catch(e){ showCallError("Failed to connect."); }
    }

    webrtc.startPolling(chatUsername);
    webrtc.onIncomingCall = function(from, data){
        if(webrtc.isInCall){ webrtc.sendSignal("call-end", {}); return; }
        answerCall(from, data);
    };

    var urlParams2 = new URLSearchParams(window.location.search);
    if(urlParams2.get("call") === "accept"){
        var pending = localStorage.getItem("CloudTokPendingCall");
        if(pending){
            var callData = JSON.parse(pending);
            localStorage.removeItem("CloudTokPendingCall");
            if(callData.from === chatUsername && callData.data){ setTimeout(function(){ answerCall(chatUsername, callData.data); }, 300); }
        }
    }

    const CONV_GIFTS = [
        { name: "Rose", emoji: "🌹", price: 0.99 }, { name: "Heart", emoji: "❤️", price: 1.99 },
        { name: "Star", emoji: "⭐", price: 4.99 }, { name: "Fire", emoji: "🔥", price: 9.99 },
        { name: "Diamond", emoji: "💎", price: 19.99 }, { name: "Crown", emoji: "👑", price: 49.99 },
        { name: "Party", emoji: "🎉", price: 9.99 }, { name: "Clap", emoji: "👏", price: 0.99 }
    ];
    let selectedConvGift = null;
    let convGiftBalance = 0;

    function showConvGiftAnim(emoji){
        var el = document.createElement("div"); el.className = "giftAnimFloat"; el.textContent = emoji;
        document.body.appendChild(el); setTimeout(function(){ el.remove(); }, 2000);
    }

    function renderConvGiftGrid(){
        var grid = document.getElementById("convGiftGrid"); grid.innerHTML = "";
        CONV_GIFTS.forEach(function(gift){
            var item = document.createElement("div"); item.className = "convGiftItem";
            item.innerHTML = '<div class="convGiftEmoji">'+gift.emoji+'</div><div class="convGiftName">'+gift.name+'</div><div class="convGiftPrice">$'+gift.price.toFixed(2)+'</div>';
            item.addEventListener("click", function(ev){
                ev.stopPropagation();
                document.querySelectorAll(".convGiftItem").forEach(function(g){ g.classList.remove("selected"); });
                item.classList.add("selected"); selectedConvGift = gift;
                document.getElementById("convGiftSendBtn").disabled = false;
                document.getElementById("convGiftSendBtn").textContent = "Send " + gift.emoji + " " + gift.name + " ($" + gift.price.toFixed(2) + ")";
            });
            grid.appendChild(item);
        });
    }

    async function loadConvGiftBalance(){
        if(!localStorage.getItem("CloudTokToken")) return;
        try {
            var result = await CloudTokAPI.request("/wallet/balance");
            convGiftBalance = result.balance || 0;
            document.getElementById("convGiftBalance").textContent = "Balance: $" + convGiftBalance.toFixed(2);
        } catch(e){}
    }

    async function sendConvGift(){
        if(!selectedConvGift || !chatUsername) return;
        if(convGiftBalance < selectedConvGift.price){ alert("Insufficient balance. Fund your wallet first."); return; }
        try {
            var result = await CloudTokAPI.request("/gifts/send", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ receiver_username: chatUsername, gift_name: selectedConvGift.name, gift_emoji: selectedConvGift.emoji, amount_usd: selectedConvGift.price })
            });
            if(result.success){
                showConvGiftAnim(selectedConvGift.emoji);
                convGiftBalance = result.wallet_balance;
                document.getElementById("convGiftBalance").textContent = "Balance: $" + convGiftBalance.toFixed(2);
                selectedConvGift = null;
                document.querySelectorAll(".convGiftItem").forEach(function(g){ g.classList.remove("selected"); });
                document.getElementById("convGiftSendBtn").disabled = true;
                document.getElementById("convGiftSendBtn").textContent = "Select a gift";
                document.getElementById("convGiftPanel").classList.remove("show");
                var msgList = document.getElementById("messageList");
                var msgDiv = document.createElement("div"); msgDiv.className = "message messageMe";
                msgDiv.innerHTML = '<div class="messageBubble">'+result.gift.emoji+' Sent '+result.gift.name+'</div>';
                msgList.appendChild(msgDiv); msgList.scrollTop = msgList.scrollHeight;
            } else { alert(result.error || "Failed to send gift"); }
        } catch(e){ alert("Failed to send gift"); }
    }

    document.getElementById("convGiftBtn").addEventListener("click", function(ev){
        ev.stopPropagation();
        var panel = document.getElementById("convGiftPanel");
        var isOpen = panel.classList.toggle("show");
        emojiBar.classList.remove("show"); gifPanel.classList.remove("show"); stickerPanel.classList.remove("show");
        if(isOpen){ renderConvGiftGrid(); loadConvGiftBalance(); }
    });

    document.getElementById("convGiftSendBtn").onclick = sendConvGift;

    setInterval(function(){
        if(webrtc.backendReady){ badge.textContent = "Calls active"; badge.className = "callStatusBadge connected"; }
        else { badge.textContent = "Calls unavailable"; badge.className = "callStatusBadge disconnected"; }
    }, 3000);
})();
</script>
</body>
</html>
