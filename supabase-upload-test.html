<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>CloudTok Supabase Upload Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #111;
      color: #fff;
      padding: 16px;
      line-height: 1.45;
    }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .description {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .card {
      background: #1c1c1c;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 15px;
    }
    input[type="file"] {
      width: 100%;
      padding: 12px;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #2196f3;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button.secondary {
      background: #333;
      margin-top: 10px;
    }
    .info {
      color: #aaa;
      font-size: 13px;
      margin-top: 10px;
    }
    #status {
      background: #1a1a1a;
      border-radius: 10px;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.5;
      min-height: 80px;
    }
    #result {
      display: none;
      background: #142014;
      border-radius: 10px;
      padding: 16px;
      margin-top: 16px;
    }
    #result h3 {
      margin-bottom: 10px;
      font-size: 16px;
    }
    #videoUrl {
      display: block;
      color: #4fc3f7;
      word-break: break-all;
      font-size: 13px;
      margin: 6px 0 12px;
    }
    .success { color: #4caf50; }
    .error { color: #f44336; }
    .token-ok { color: #4caf50; }
    .token-bad { color: #f44336; }
  </style>
</head>
<body>
  <div class="container">
    <h1>CloudTok Supabase Test</h1>
    <p class="description">
      Upload a small video to test Supabase Storage through your Cloudflare Worker.
    </p>

    <!-- Token status -->
    <div class="card">
      <label>Token Status</label>
      <div id="tokenStatus" class="info">Checking token...</div>
      <button class="secondary" id="checkTokenBtn">Check Token Again</button>
    </div>

    <!-- File selection -->
    <div class="card">
      <label for="videoInput">Select a small test video</label>
      <input type="file" id="videoInput" accept="video/*">
      <div class="info" id="fileInfo">No video selected</div>
      <button id="uploadButton">Upload to Supabase</button>
    </div>

    <!-- Status -->
    <div class="card">
      <label>Status</label>
      <div id="status">Waiting for video...</div>
    </div>

    <!-- Result -->
    <div id="result">
      <h3>Upload Result</h3>
      <p><strong>Provider:</strong> <span id="provider"></span></p>
      <p><strong>Path:</strong> <span id="path"></span></p>
      <p><strong>URL:</strong></p>
      <a id="videoUrl" target="_blank" rel="noopener"></a>
    </div>
  </div>

  <script>
    const API = "https://cloudtok-api.bossmanp16.workers.dev/api";

    const videoInput   = document.getElementById("videoInput");
    const uploadButton = document.getElementById("uploadButton");
    const statusEl     = document.getElementById("status");
    const resultBox    = document.getElementById("result");
    const videoUrlEl   = document.getElementById("videoUrl");
    const providerEl   = document.getElementById("provider");
    const pathEl       = document.getElementById("path");
    const fileInfo     = document.getElementById("fileInfo");
    const tokenStatus  = document.getElementById("tokenStatus");
    const checkTokenBtn = document.getElementById("checkTokenBtn");

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function checkToken() {
      const token = localStorage.getItem("CloudTokToken");
      if (!token) {
        tokenStatus.innerHTML = '<span class="token-bad">No token found. Please log into CloudTok first.</span>';
        return false;
      }
      tokenStatus.innerHTML = '<span class="token-ok">Token found (' + token.slice(0, 18) + '...)</span>';
      return true;
    }

    // Check token on load
    checkToken();
    checkTokenBtn.addEventListener("click", checkToken);

    videoInput.addEventListener("change", function () {
      const file = videoInput.files[0];
      if (!file) {
        fileInfo.textContent = "No video selected";
        setStatus("Waiting for video...");
        return;
      }
      const sizeMB = (file.size / 1024 / 1024).toFixed(2);
      fileInfo.textContent = file.name + "  •  " + sizeMB + " MB  •  " + (file.type || "unknown");
      setStatus("Video ready.\nName: " + file.name + "\nSize: " + sizeMB + " MB");
    });

    uploadButton.addEventListener("click", async function () {
      const file = videoInput.files[0];
      if (!file) {
        setStatus("Please select a video first.");
        return;
      }

      if (!checkToken()) {
        setStatus("No valid token. Log into CloudTok first, then come back.");
        return;
      }

      uploadButton.disabled = true;
      resultBox.style.display = "none";
      setStatus("Starting Supabase upload test...\n");

      try {
        const token = localStorage.getItem("CloudTokToken");
        const form = new FormData();
        form.append("file", file);

        setStatus(statusEl.textContent + "Sending request to Worker...\n");

        const response = await fetch(API + "/storage/test/supabase-upload", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + token
          },
          body: form
        });

        const text = await response.text();
        setStatus(
          "HTTP status: " + response.status + "\n\n" +
          "Server response:\n" + text
        );

        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error("Server returned non-JSON response");
        }

        if (!data.success) {
          throw new Error(data.error || data.message || "Upload failed");
        }

        // Success
        videoUrlEl.textContent = data.url || "No URL";
        videoUrlEl.href = data.url || "#";
        providerEl.textContent = data.provider || "supabase";
        pathEl.textContent = data.path || "N/A";
        resultBox.style.display = "block";

        setStatus(statusEl.textContent + "\n\n✅ SUPABASE UPLOAD SUCCESSFUL");
      } catch (err) {
        setStatus(statusEl.textContent + "\n\n❌ TEST FAILED\n" + err.message);
      } finally {
        uploadButton.disabled = false;
      }
    });
  </script>
</body>
</html>
