<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CloudTok Supabase Video Test</title><style>

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
    padding:20px;
}

input,
button{
    width:100%;
    max-width:700px;
    box-sizing:border-box;
    padding:12px;
    margin:10px 0;
}

button{
    background:#2196f3;
    color:#fff;
    border:0;
    border-radius:6px;
    font-size:16px;
}

video{
    display:block;
    width:100%;
    max-width:700px;
    margin-top:20px;
    background:#000;
}

#status{
    margin-top:20px;
    padding:15px;
    background:#222;
    border-radius:6px;
    white-space:pre-wrap;
    word-break:break-all;
}

</style></head><body><h1>CloudTok Supabase Video Test</h1><p>
Paste a Supabase public video URL below and test whether
the browser can load and play it.
</p><input
type="text"
id="urlInput"
placeholder="Paste Supabase video URL"

«»

<button id="loadButton">
Load Supabase Video
</button><video
id="videoPlayer"
controls
playsinline>
</video>

<div id="status">
Waiting for video URL...
</div><script>

const urlInput =
document.getElementById("urlInput");

const loadButton =
document.getElementById("loadButton");

const videoPlayer =
document.getElementById("videoPlayer");

const status =
document.getElementById("status");


function setStatus(message){

    status.textContent =
    message;

}


loadButton.addEventListener(
    "click",
    () => {

        const url =
        urlInput.value.trim();


        if(!url){

            setStatus(
                "Please enter a Supabase video URL."
            );

            return;

        }


        setStatus(
            "Loading video...\n\n" +
            url
        );


        videoPlayer.pause();

        videoPlayer.removeAttribute(
            "src"
        );

        videoPlayer.load();


        videoPlayer.src =
        url;


        videoPlayer.load();

    }
);


videoPlayer.addEventListener(
    "loadedmetadata",
    () => {

        setStatus(
            "✅ VIDEO LOADED\n\n" +

            "Duration: " +
            videoPlayer.duration +
            " seconds\n\n" +

            "Resolution: " +
            videoPlayer.videoWidth +
            " × " +
            videoPlayer.videoHeight
        );

    }
);


videoPlayer.addEventListener(
    "canplay",
    () => {

        setStatus(
            "✅ VIDEO CAN PLAY\n\n" +
            "Supabase video delivery is working."
        );

    }
);


videoPlayer.addEventListener(
    "error",
    () => {

        const error =
        videoPlayer.error;


        setStatus(
            "❌ VIDEO LOAD FAILED\n\n" +

            "Error code: " +
            (error ?
            error.code :
            "unknown") +
            "\n\n" +

            "Check the Supabase URL, bucket visibility, " +
            "CORS, and video response."
        );

    }
);

</script></body></html>
