<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live - CloudTok</title>
<link rel="stylesheet" href="assets/css/base.css">
<style>
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
.live-container{max-width:420px;width:100%;padding:20px;text-align:center}
.live-icon{font-size:80px;margin-bottom:20px}
h1{font-size:24px;margin:0 0 8px}
p{color:#aaa;margin:0 0 30px;font-size:14px}
.live-btn{background:#ff2d55;color:#fff;border:none;border-radius:50%;width:120px;height:120px;font-size:18px;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 0 30px rgba(255,45,85,.4)}
.live-btn:hover{transform:scale(1.08);box-shadow:0 0 50px rgba(255,45,85,.6)}
.live-btn:active{transform:scale(.95)}
.back{position:fixed;top:20px;left:20px;background:rgba(255,255,255,.1);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;z-index:10}

.streamView{display:none;width:100%;max-width:500px;flex-direction:column;align-items:center;gap:0;position:relative;height:100vh;}
.streamView.active{display:flex;}
.streamVideo{width:100%;height:100vh;object-fit:cover;background:#000;}
.streamLocal{width:100px;height:130px;border-radius:12px;border:2px solid #ff2d55;object-fit:cover;position:fixed;top:80px;right:12px;z-index:5;}
.streamOverlay{position:absolute;top:0;left:0;right:0;padding:12px 16px;display:flex;align-items:center;gap:10px;background:linear-gradient(rgba(0,0,0,.7),transparent);z-index:6;}
.streamOverlay .back{position:static;width:36px;height:36px;}
.streamTitleDisplay{font-size:16px;font-weight:700;flex:1;}
.streamViewers{display:flex;align-items:center;gap:6px;padding:4px 10px;background:rgba(255,45,85,.9);border-radius:20px;font-size:12px;font-weight:600;}
.liveDot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.streamControls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:16px;z-index:6;}
.streamCtrlBtn{width:50px;height:50px;border-radius:50%;border:none;font-size:20px;cursor:pointer;backdrop-filter:blur(10px);}
.streamCtrlBtn.end{background:rgba(255,45,85,.9);color:#fff;}
.streamCtrlBtn.mute{background:rgba(255,255,255,.2);color:#fff;}
.streamCtrlBtn.video{background:rgba(255,255,255,.2);color:#fff;}

.activeStreams{width:100%;max-width:600px;margin-top:30px;}
.activeStreams h3{color:rgba(255,255,255,.5);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}
.streamCard{display:flex;align-items:center;gap:12px;padding:12px;background:rgba(255,255,255,.04);border-radius:12px;margin-bottom:8px;cursor:pointer;}
.streamCard:hover{background:rgba(255,255,255,.06);}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:9999;}
.toast.success{background:#00c853;color:#fff;}
.toast.error{background:#ff2d55;color:#fff;}
</style>
</head>
<body>
<button class="back" onclick="history.back()">&#8592;</button>

<div class="live-container" id="startScreen">
    <div class="live-icon">&#128248;</div>
    <h1>Go Live</h1>
    <p>Start a live stream and connect with your audience in real-time</p>
    <input id="streamTitleInput" type="text" placeholder="Stream title..." style="width:100%;padding:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font-size:15px;outline:none;margin-bottom:16px;text-align:center;">
    <button class="live-btn" id="goLiveBtn">GO LIVE</button>
    <div class="activeStreams" id="activeStreams"></div>
</div>

<div class="streamView" id="streamView">
    <video class="streamVideo" id="streamMainVideo" autoplay playsinline></video>
    <video class="streamLocal" id="streamLocal" autoplay playsinline muted></video>
    <div class="streamOverlay">
        <button class="back" onclick="endStream()">←</button>
        <div class="liveDot"></div>
        <div class="streamTitleDisplay" id="streamTitleDisplay">Live Stream</div>
        <div class="streamViewers" id="streamViewers">0 viewers</div>
    </div>
    <div class="streamControls">
        <button class="streamCtrlBtn mute" id="streamMuteBtn">🎤</button>
        <button class="streamCtrlBtn video" id="streamVideoBtn">📹</button>
        <button class="streamCtrlBtn end" id="streamEndBtn">⏹</button>
    </div>
</div>

<script src="assets/js/database/database.js"></script>
<script src="assets/js/api/api.js"></script>
<script src="assets/js/core/webrtc.js"></script>
<script src="assets/js/core/callPoller.js"></script>
<script>
let localStream = null;
let isStreaming = false;
let streamKey = null;
let viewerPoll = null;
let signalPoll = null;
let isMuted = false;
let isVideoOff = false;
let viewerConnections = [];

function showToast(msg, type="success"){
    const t=document.createElement("div");
    t.className="toast "+type;
    t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),3000);
}

document.getElementById("goLiveBtn").onclick = async ()=>{
    if(!localStorage.getItem("CloudTokToken")){
        showToast("Please login first","error");
        return;
    }

    const title = document.getElementById("streamTitleInput").value.trim() || "Live Stream";

    try {
        localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
        });
    } catch(e) {
        showToast("Camera/microphone access required","error");
        return;
    }

    document.getElementById("streamLocal").srcObject = localStream;
    document.getElementById("streamMainVideo").srcObject = localStream;

    const webrtc = window.CloudTokWebRTC;
    const result = await webrtc.startLiveStream(title);

    if(result && result.success){
        streamKey = result.stream_key;
        isStreaming = true;

        document.getElementById("startScreen").style.display = "none";
        document.getElementById("streamView").classList.add("active");
        document.getElementById("streamTitleDisplay").textContent = title;

        startViewerPoll();
        startSignalPoll();
        showToast("You are now live!");
    } else {
        const errMsg = (result && result.error) ? result.error : "Failed to start stream";
        showToast(errMsg, "error");
    }
};

function startSignalPoll(){
    let lastSignalId = 0;
    signalPoll = setInterval(async ()=>{
        if(!isStreaming || !streamKey) return;
        try {
            const result = await CloudTokAPI.request("/webrtc/poll?after=" + lastSignalId);
            if(result.signals){
                for(const signal of result.signals){
                    if(signal.id > lastSignalId) lastSignalId = signal.id;

                    if(signal.type === "live-join"){
                        handleViewerJoin(signal.from, signal.data);
                    } else if(signal.type === "live-leave"){
                        handleViewerLeave(signal.from);
                    }
                }
            }
        } catch(e){}
    }, 1000);
}

async function handleViewerJoin(viewerUsername, data){
    if(!localStream) return;

    const pc = new RTCPeerConnection({
        iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" }
        ]
    });

    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    pc.onicecandidate = (e) => {
        if(e.candidate){
            CloudTokAPI.request("/webrtc/signal", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    to_username: viewerUsername,
                    signal_type: "live-ice",
                    signal_data: { candidate: e.candidate.toJSON(), viewer: viewerUsername }
                })
            });
        }
    };

    pc.onconnectionstatechange = () => {
        if(pc.connectionState === "disconnected" || pc.connectionState === "failed"){
            pc.close();
            viewerConnections = viewerConnections.filter(v => v.username !== viewerUsername);
            updateViewerCount();
        }
    };

    viewerConnections.push({ username: viewerUsername, pc: pc });
    updateViewerCount();

    if(data && data.offer){
        await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        await CloudTokAPI.request("/webrtc/signal", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                to_username: viewerUsername,
                signal_type: "live-answer",
                signal_data: { sdp: pc.localDescription.sdp, type: pc.localDescription.type }
            })
        });
    }
}

function handleViewerLeave(viewerUsername){
    const viewer = viewerConnections.find(v => v.username === viewerUsername);
    if(viewer){
        viewer.pc.close();
        viewerConnections = viewerConnections.filter(v => v.username !== viewerUsername);
        updateViewerCount();
    }
}

function updateViewerCount(){
    document.getElementById("streamViewers").textContent = viewerConnections.length + " viewers";
}

document.getElementById("streamEndBtn").onclick = endStream;

async function endStream(){
    if(streamKey){
        try {
            await CloudTokAPI.request("/live/end", {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({stream_key: streamKey})
            });
        } catch(e){}
    }

    viewerConnections.forEach(v => v.pc.close());
    viewerConnections = [];

    if(localStream){
        localStream.getTracks().forEach(t=>t.stop());
        localStream = null;
    }
    if(viewerPoll){ clearInterval(viewerPoll); viewerPoll = null; }
    if(signalPoll){ clearInterval(signalPoll); signalPoll = null; }
    isStreaming = false;
    streamKey = null;

    document.getElementById("streamView").classList.remove("active");
    document.getElementById("startScreen").style.display = "block";
    showToast("Stream ended");
    loadActiveStreams();
};

document.getElementById("streamMuteBtn").onclick = ()=>{
    isMuted = !isMuted;
    if(localStream) localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted);
    document.getElementById("streamMuteBtn").textContent = isMuted ? "🔇" : "🎤";
};

document.getElementById("streamVideoBtn").onclick = ()=>{
    isVideoOff = !isVideoOff;
    if(localStream) localStream.getVideoTracks().forEach(t=>t.enabled=!isVideoOff);
    document.getElementById("streamVideoBtn").textContent = isVideoOff ? "📷" : "📹";
};

function startViewerPoll(){
    viewerPoll = setInterval(async ()=>{
        try {
            const result = await CloudTokAPI.request("/live/streams");
            const streams = result.streams || [];
            const myStream = streams.find(s=>s.stream_key === streamKey);
            if(myStream){
                document.getElementById("streamViewers").textContent = viewerConnections.length + " viewers";
            }
        } catch(e){}
    }, 5000);
}

async function loadActiveStreams(){
    try {
        const webrtc = window.CloudTokWebRTC;
        const streams = await webrtc.getLiveStreams();
        const container = document.getElementById("activeStreams");
        if(streams.length === 0){
            container.innerHTML = '<p style="color:rgba(255,255,255,.3);font-size:13px;text-align:center;">No live streams right now</p>';
            return;
        }
        container.innerHTML = '<h3>Live Now</h3>';
        streams.forEach(s=>{
            const card = document.createElement("div");
            card.className = "streamCard";
            card.innerHTML = `
                <div class="liveDot" style="background:#ff2d55;"></div>
                <div style="flex:1;">
                    <div style="font-weight:600;font-size:14px;">${s.display_name||s.username}</div>
                    <div style="color:rgba(255,255,255,.4);font-size:12px;">${s.title||"Live"}</div>
                </div>
            `;
            container.appendChild(card);
        });
    } catch(e){
        document.getElementById("activeStreams").innerHTML = '<p style="color:rgba(255,255,255,.3);font-size:13px;text-align:center;">Live streams unavailable</p>';
    }
}

loadActiveStreams();
</script>
</body>
</html>
