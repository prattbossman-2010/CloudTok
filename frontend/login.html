<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CloudTok - Login</title>

		<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/login.css">

</head>

<body>

<div class="authPage">

<div class="authBox">

<h1>☁ CloudTok</h1>

<h2>Login</h2>

<input
id="email"
type="email"
placeholder="Email">

<div style="position:relative;">
<input
id="password"
type="password"
placeholder="Password"
style="width:100%;box-sizing:border-box;padding-right:45px;">
<button type="button" id="togglePassword" style="position:absolute;right:5px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.1);border:none;color:#fff;cursor:pointer;font-size:18px;padding:6px 8px;border-radius:6px;z-index:2;">👁</button>
</div>

<a href="forgot-password.html" class="forgotLink">Forgot password?</a>

<button id="loginBtn">

Login

</button>

<p>

Don't have an account?

<a href="signup.html">

Sign Up

</a>

</p>

</div>

</div>

<script src="assets/js/database/users.js"></script>
		<script src="assets/js/database/databaseMigration.js"></script>
		<script src="assets/js/api/api.js"></script>
		
		<script>

if(
localStorage.getItem(
"CloudTokCurrentUser"
)
){

window.location.replace(
"profile.html?user=" +
encodeURIComponent(
localStorage.getItem(
"CloudTokCurrentUser"
)
)

);

}

</script>
		
<script>
document.getElementById("togglePassword")?.addEventListener("click", function(){
    const input = document.getElementById("password");
    if(input.type === "password"){ input.type = "text"; this.textContent = "🙈"; }
    else { input.type = "password"; this.textContent = "👁"; }
});
</script>

<script src="assets/js/components/toast.js"></script>
<script src="assets/js/sign/login.js"></script>
		
		

</body>

</html>
