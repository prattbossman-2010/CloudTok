<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CloudTok - Login</title>

		<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/login.css">

<link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>

<div class="authPage">

<div class="authBox">

<div style="text-align:center;margin-bottom:20px;">
<img src="images/logo.jpg" alt="CloudTok" style="width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 12px;box-shadow:0 4px 20px rgba(255,45,85,.3);">
<h1 style="margin:0;font-size:26px;color:#fff;">Cloud<span style="color:#fe2d55;">Tok</span></h1>
<p style="margin:4px 0 0;color:rgba(255,255,255,.4);font-size:14px;">Login</p>
</div>

<input
id="email"
type="email"
placeholder="Email">

<div style="position:relative;">
<input
id="password"
type="password"
placeholder="Password"
style="width:100%;box-sizing:border-box;padding-right:45px;">
<button type="button" id="togglePassword" style="position:absolute;right:5px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.1);border:none;color:#fff;cursor:pointer;font-size:18px;padding:6px 8px;border-radius:6px;z-index:2;">👁</button>
</div>

<a href="forgot-password.html" class="forgotLink">Forgot password?</a>

<button id="loginBtn">

Login

</button>

<p>

Don't have an account?

<a href="signup.html">

Sign Up

</a>

</p>

</div>

</div>

<script src="assets/js/database/users.js"></script>
		<script src="assets/js/database/databaseMigration.js"></script>
		<script src="assets/js/api/api.js"></script>
		
		<script>

if(
localStorage.getItem(
"CloudTokCurrentUser"
)
){

window.location.replace(
"profile.html?user=" +
encodeURIComponent(
localStorage.getItem(
"CloudTokCurrentUser"
)
)

);

}

</script>
		
<script>
document.getElementById("togglePassword")?.addEventListener("click", function(){
    const input = document.getElementById("password");
    if(input.type === "password"){ input.type = "text"; this.textContent = "🙈"; }
    else { input.type = "password"; this.textContent = "👁"; }
});
</script>

<script src="assets/js/components/toast.js"></script>
<script src="assets/js/sign/login.js"></script>
		
		

</body>

</html>
