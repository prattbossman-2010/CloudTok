<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Supabase Video List Test</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    padding:20px;
}

button{
    width:100%;
    max-width:500px;
    padding:15px;
    margin:10px 0;
    background:#2196f3;
    color:white;
    border:0;
    border-radius:8px;
    font-size:16px;
}

#status{
    margin-top:20px;
    padding:15px;
    background:#222;
    border-radius:8px;
    white-space:pre-wrap;
    word-break:break-word;
}

</style>

</head>

<body>

<h1>Supabase Video List Test</h1>

<p>
This page tests whether CloudTok can retrieve
videos from the Supabase cloudtok-videos bucket.
</p>

<button id="loadButton">
Load Supabase Videos
</button>

<div id="status">
Waiting...
</div>

<script>

const API =
"https://cloudtok-api.bossmanp16.workers.dev/api";


const loadButton =
document.getElementById("loadButton");


const status =
document.getElementById("status");


loadButton.addEventListener(
    "click",
    async function(){

        status.textContent =
        "Checking CloudTok login...";


        const token =
        localStorage.getItem(
            "CloudTokToken"
        );


        if(!token){

            status.textContent =
            "❌ CloudTokToken not found.\n\n" +
            "Please log into CloudTok first.";

            return;

        }


        status.textContent =
        "Loading videos from Supabase...\n\n" +
        "Please wait.";


        try{

            const response =
            await fetch(
                API +
                "/storage/test/supabase-videos",
                {
                    method:"GET",

                    headers:{
                        Authorization:
                        "Bearer " + token
                    }
                }
            );


            const text =
            await response.text();


            status.textContent =
            "HTTP STATUS: " +
            response.status +
            "\n\n" +
            "SERVER RESPONSE:\n\n" +
            text;


        }
        catch(error){

            status.textContent =
            "❌ REQUEST FAILED\n\n" +
            error.message;

        }

    }
);

</script>

</body>

</html>
